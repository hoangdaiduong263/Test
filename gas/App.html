  const cost=L.reduce((a,t)=>a+t.frac*pr(t.vk),0);
  const nav=`<div class="row" style="justify-content:space-between;margin:0 0 10px">
    <button type="button" class="ghost sm" ${prev!=null?`data-tripnav="${i}:${prev}"`:"disabled"}>← ${prev!=null?dayLabel(prev):"ngày trước"}</button>
    <span class="mini" style="align-self:center">${k+1}/${days.length} ngày có chuyến trong kỳ</span>
    <button type="button" class="ghost sm" ${next!=null?`data-tripnav="${i}:${next}"`:"disabled"}>${next!=null?dayLabel(next):"ngày sau"} →</button></div>`;
  const body=!L.length?`${nav}<p class="note">${(s.tc&&s.tc[d]&&s.tc[d].length)&&!D.T?"Gói dữ liệu đang dùng chưa có lộ trình chuyến. Dán Code.gs bản mới rồi chạy menu D2S Simulation → Cập nhật dữ liệu ngay.":"Ngày này không có chuyến nào trong file linehaul."}</p>`:`${nav}
    <p style="margin:0 0 4px"><b>${esc(tripSummary(L))}</b></p>
    <p class="note" style="margin:0 0 10px">Tính cho điểm này: ${Object.entries(byV).map(([v,x])=>`${fx2(x)}×${esc(v)}`).join(" + ")} ≈ <b>${f0(cost/1e3)}k</b> tiền xe${r&&r.vol>0&&r.truck&&Math.abs(r.truck-cost)>1e3?` (gốc đang tính ${f0(r.truck/1e3)}k vì còn trừ phần xe in-house hoặc sản lượng đã chỉnh)`:""}. Chuyến chở riêng tính cả chuyến. Chuyến có hàng của nơi khác tính theo số đơn của điểm này trên tổng số đơn lên xe (đếm theo đơn, không theo TO: một TO có thể chứa nhiều đơn).</p>
    <ul class="trlist">${L.sort((a,b)=>(a.stops[0].a??0)-(b.stops[0].a??0)).map(t=>`<li><details class="trp"><summary><span class="lnk">${esc(t.code)}</span> · ${esc(t.veh)} · ${TRK_KIND[t.kind]} · tính <b>${fx2(t.frac)}</b>${t.frac<0.999?` (${f0(t.myUp)}/${f0(t.upAll)} đơn)`:""}</summary>
      <div class="trbody"><p class="mini" style="margin:4px 0 6px;white-space:normal">${[t.plate&&"Biển số "+esc(t.plate),t.inh?"xe in-house":"xe thuê ngoài",t.adhoc?"chuyến adhoc (ngoài plan)":"theo plan",t.km!=null&&f1(t.km)+" km"].filter(Boolean).join(" · ")}</p>${tripPath(t,vs)}</div></details></li>`).join("")}</ul>
    <p class="note">Bấm mã chuyến để xem lộ trình. Giờ "KH" là giờ theo kế hoạch.</p>`;
  return {title:`Chuyến xe · ${s.n}`,sub:`${dayLabel(d)} · ${DTN[(r&&r.t)!=null?r.t:DT[d]]}`,size:"md",body};};

/* =====================================================================
   HÀNG D2S VỀ SOC NÀO
   Chỉ tính đơn D2S: số đơn của các điểm có trong Volume Tracker, đúng ngày điểm chạy D2S.
   Chuyến linehaul chỉ dùng để biết đơn của điểm được xe thả ở SOC nào. Hàng của Hub, điểm ngoài Volume Tracker,
   hàng nhận ở SOC… đi chung xe KHÔNG được cộng vào.
   Cách chia trong một chuyến (file linehaul không có SOC đích của từng đơn):
   - Nguồn = điểm lấy hàng (điểm D2S, Hub); đích = SOC có đơn xuống, nằm SAU điểm lấy hàng.
   - Đơn D2S chỉ xuống ở SOC (không xuống Hub). Hàng Hub có thể xuống chỗ khác.
   - Chuyến chỉ có 1 SOC sau điểm: rõ ràng. Chuyến nhiều SOC: dựa vào thói quen của chính điểm đó
     (tỷ lệ SOC ở các chuyến chỉ ghé 1 SOC) rồi cân lại cho khớp số đơn lên ở từng điểm và đơn xuống ở từng SOC.
   SOC là nơi xe trả hàng (chặng đầu), chưa tính chuyển tiếp giữa các SOC.
   ===================================================================== */
const SOC_HUB="Xuống ở Hub/điểm khác",SOC_NONE="Chưa rõ SOC";
const TRKN=new Set(S.map(s=>s.n.trim()));
/* thói quen SOC của từng điểm: từ các chuyến chỉ có một SOC nhận hàng sau điểm */
const SOCPR={};
Object.values(TRP).forEach(t=>{const st=t[5];st.forEach((x,k)=>{const n=TRN[x[0]];if(x[1]!==0||!(x[2]>0)||!TRKN.has(n))return;
  const sn=st.slice(k+1).filter(y=>y[1]===2&&y[3]>0);if(sn.length!==1)return;const p=SOCPR[n]=SOCPR[n]||{},k2=TRN[sn[0][0]];p[k2]=(p[k2]||0)+x[2];});});
/* chia đơn của các điểm D2S trong một chuyến về các SOC: {tên điểm: {SOC: đơn}} */
const TRIPA={};
function tripAlloc(code){if(code in TRIPA)return TRIPA[code];const t=TRP[code];if(!t)return TRIPA[code]=null;const st=t[5];
  const src=[],snk=[];st.forEach((x,k)=>{if(x[1]!==2&&x[2]>0)src.push({k,n:TRN[x[0]],up:x[2],d2s:x[1]===0&&TRKN.has(TRN[x[0]])});else if(x[1]===2&&x[3]>0)snk.push({k,n:TRN[x[0]],dn:x[3]});});
  const out={};if(!src.some(a=>a.d2s))return TRIPA[code]=out;
  const W=src.map(a=>{const later=snk.map((b,j)=>b.k>a.k?j:-1).filter(j=>j>=0),p=SOCPR[a.n],tot=p?later.reduce((z,j)=>z+(p[snk[j].n]||0),0):0;
    const row=snk.map(()=>0);later.forEach(j=>{row[j]=a.up*((tot>0?(p[snk[j].n]||0)/tot:0)*0.9+0.1/later.length);});return row;});
  for(let it=0;it<80;it++){let ch=0;
    src.forEach((a,i)=>{const rs=W[i].reduce((z,v)=>z+v,0);if(rs<=0)return;let f=a.up/rs;if(!a.d2s)f=Math.min(1,f);if(Math.abs(f-1)>1e-4)ch=1;W[i]=W[i].map(v=>v*f);});
    snk.forEach((b,j)=>{const cs=W.reduce((z,r)=>z+r[j],0);if(cs>b.dn){ch=1;const g=b.dn/cs;W.forEach(r=>{r[j]*=g;});}});
    if(!ch)break;}
  src.forEach((a,i)=>{if(!a.d2s)return;const o=out[a.n]=out[a.n]||{};let sum=0;
    snk.forEach((b,j)=>{if(W[i][j]>0){o[b.n]=(o[b.n]||0)+W[i][j];sum+=W[i][j];}});
    const rest=a.up-sum;if(rest>1e-6){const later=snk.filter(b=>b.k>a.k);const k=later.length?later[later.length-1].n:SOC_NONE;o[k]=(o[k]||0)+rest;}});
  return TRIPA[code]=out;}
const SOCSH=S.map(()=>new Array(ND).fill(null));   // SOCSH[i][d] = {SOC: tỷ lệ}, tổng = 1; null = ngày đó không có chuyến
S.forEach((s,i)=>{const vs=s.n.trim();for(let d=0;d<ND;d++){const L=(s.tc&&s.tc[d])||[];let n=0;const sh={};
  L.forEach(c=>{const a=tripAlloc(c),o=a&&a[vs];if(!o)return;Object.entries(o).forEach(([k,v])=>{sh[k]=(sh[k]||0)+v;n+=v;});});
  if(n>0){Object.keys(sh).forEach(k=>sh[k]/=n);SOCSH[i][d]=sh;}}});
/* màu theo SOC, cố định: SOC cùng miền (Bắc / Nam / Trung) có màu khác nhau, xếp theo lượng hàng cả kỳ */
const SOCCOL=(()=>{const cl=R=>R==="HN"||R==="North"?"N":R==="DNCH"?"C":"S",by={};
  S.forEach((s,i)=>{for(let d=0;d<ND;d++){const sh=SOCSH[i][d];if(!sh)continue;Object.entries(sh).forEach(([k,v])=>{const x=by[k]=by[k]||{v:0,c:{}};x.v+=v*s.v[d];x.c[cl(s.R)]=(x.c[cl(s.R)]||0)+v*s.v[d];});}});
  const grp={};Object.entries(by).filter(([k])=>k!==SOC_HUB&&k!==SOC_NONE).forEach(([k,x])=>{const c=Object.entries(x.c).sort((a,b)=>b[1]-a[1])[0][0];(grp[c]=grp[c]||[]).push([k,x.v]);});
  const m={};Object.values(grp).forEach(L=>L.sort((a,b)=>b[1]-a[1]).forEach(([k],j)=>{m[k]=j<8?`var(--s${j+1})`:"var(--muted)";}));m[SOC_NONE]="var(--line)";m[SOC_HUB]="var(--muted)";return m;})();
const socCol=k=>SOCCOL[k]||"var(--muted)";
const SOCX=k=>k===SOC_NONE?2:k===SOC_HUB?1:0;
/* đơn D2S (gốc) của một điểm một ngày, chia theo SOC */
function socSplit(i,d){const r=BASE.rows[i][d];if(!(r&&r.vol>0))return null;const sh=SOCSH[i][d];
  if(!sh)return {[SOC_NONE]:r.vol};const o={};Object.entries(sh).forEach(([k,v])=>{o[k]=r.vol*v;});return o;}
const nfD=v=>f0(v/Math.max(1,ACT.length));
const pctS=(v,a)=>{const p=v/Math.max(1e-9,a)*100;return p>0&&p<1?"<1%":f0(p)+"%";};   // tổng cả kỳ → đơn/ngày (chia số ngày trong kỳ, như bảng Từng điểm)

/* ---------- tooltip dùng chung: phần tử có data-tt ---------- */
(()=>{const t=document.createElement("div");t.id="gtip";document.body.appendChild(t);
  const show=e=>{const el=e.target.closest&&e.target.closest("[data-tt]");if(!el){t.style.opacity=0;return;}t.innerHTML=el.dataset.tt;
    const r=el.getBoundingClientRect(),w=t.offsetWidth,hh=t.offsetHeight;let x=r.left+r.width/2-w/2,y=r.top-hh-8;
    x=Math.max(6,Math.min(window.innerWidth-w-6,x));if(y<6)y=r.bottom+8;t.style.left=x+"px";t.style.top=y+"px";t.style.opacity=1;};
  document.addEventListener("mouseover",show);document.addEventListener("focusin",show);
  document.addEventListener("mouseout",e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest("[data-tt]"))t.style.opacity=0;});
  document.addEventListener("scroll",()=>{t.style.opacity=0;},true);})();

/* ---------- cột theo ngày, xếp chồng theo SOC ---------- */
function socCols(days,order,opt){opt=opt||{};  // days: [{d, parts:{SOC:v}, tt, trips}]
  const mx=Math.max(1,...days.map(x=>Object.values(x.parts||{}).reduce((a,b)=>a+b,0)));
  const nice=v=>{const m=Math.pow(10,Math.floor(Math.log10(v)));return [1,1.2,1.5,2,2.5,3,4,5,6,8,10].map(k=>k*m).find(k=>k>=v);},top=nice(mx),half=top/2;
  const step=Math.max(1,Math.ceil(days.length/8));
  return `<div class="sv-cols" role="img" aria-label="${esc(opt.aria||"Đơn theo ngày")}">
    <div class="gl" style="bottom:100%"><span>${f0(top)} đơn</span></div><div class="gl" style="bottom:50%"><span>${f0(half)}</span></div>
    ${days.map(x=>{const tot=Object.values(x.parts||{}).reduce((a,b)=>a+b,0);
      const segs=order.filter(k=>x.parts&&x.parts[k]>0).map(k=>`<div class="sv-seg" style="height:${(x.parts[k]/top*100).toFixed(2)}%;background:${socCol(k)}"></div>`).join("");
      return `<button type="button" class="sv-col"${x.trips?` data-trips="${x.trips}"`:""} data-tt="${esc(x.tt)}" aria-label="${esc(dayLabel(x.d)+": "+f0(tot)+" đơn")}">${segs}</button>`;}).join("")}</div>
    <div class="sv-x">${days.map((x,k)=>`<span>${k%step===0?dayLabel(x.d):""}</span>`).join("")}</div>`;}

/* ---------- tab Gốc: mỗi SOC nhận bao nhiêu hàng D2S ---------- */
function socAgg(idx){const tot={},byPt={},byDay={};
  idx.forEach(i=>ACT.forEach(d=>{const p=socSplit(i,d);if(!p)return;Object.entries(p).forEach(([k,v])=>{tot[k]=(tot[k]||0)+v;
    const b=byPt[k]=byPt[k]||{};b[i]=(b[i]||0)+v;const y=byDay[k]=byDay[k]||{};y[d]=(y[d]||0)+v;});}));return {tot,byPt,byDay};}
function socCard(){const idx=IDX().filter(i=>BASE.tot[i].vol>0),A=socAgg(idx);
  const L=Object.entries(A.tot).filter(([k,v])=>v>0).sort((a,b)=>SOCX(a[0])-SOCX(b[0])||b[1]-a[1]);if(!L.length)return "";
  const all=L.reduce((a,x)=>a+x[1],0),mx=Math.max(...L.map(x=>x[1]));
  const sel=ui.socSel&&A.tot[ui.socSel]?ui.socSel:null;
  let det="";
  if(sel){const pts=Object.entries(A.byPt[sel]).sort((a,b)=>b[1]-a[1]),st=A.tot[sel];
    const days=ACT.map(d=>{const v=(A.byDay[sel]||{})[d]||0;return {d,parts:{[sel]:v},tt:`<b>${dayLabel(d)}</b> · ${f0(v)} đơn D2S về ${esc(sel)}`};});
    det=`<div class="sv-det" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)">
      <div class="row" style="justify-content:space-between;margin:0"><h4 style="margin:0">${esc(sel)} · ${nfD(st)} đơn/ngày từ ${pts.length} điểm</h4><button type="button" class="ghost sm" data-socsel="">Đóng</button></div>
      ${socCols(days,[sel],{aria:"Đơn D2S về "+sel+" theo ngày"})}
      <div class="tablewrap" style="margin-top:12px"><table class="data"><thead><tr><th>Điểm gửi</th><th>Đơn/ngày</th><th>% của SOC</th><th>% hàng của điểm</th></tr></thead><tbody>
      ${pts.slice(0,ui.socN||12).map(([i,v])=>{i=+i;const own=BASE.tot[i].vol||1;return `<tr class="click" data-pt="${i}"><td class="l rowname">${esc(S[i].n)}<span class="mini">${S[i].R}${S[i].h?" · "+esc(S[i].h):""}</span></td><td class="num">${nfD(v)}</td><td class="num">${pctS(v,st)}</td><td class="num">${pctS(v,own)}</td></tr>`;}).join("")}
      </tbody></table></div>${pts.length>(ui.socN||12)?`<div class="more-row"><button type="button" class="ghost sm" data-socmore="1">Hiện thêm ${pts.length-(ui.socN||12)} điểm</button></div>`:""}</div>`;}
  return `<div class="card"><h3>Hàng D2S về từng SOC <span class="mini">đơn/ngày bình quân trong kỳ · bấm một SOC để xem điểm gửi và từng ngày</span></h3>
    <div class="sv-rows">${L.map(([k,v])=>`<div class="sv-row${k===sel?" sel":""}" data-socsel="${esc(k===sel?"":k)}" data-tt="${esc(`<b>${esc(k)}</b><br>${nfD(v)} đơn/ngày · ${pctS(v,all)} hàng D2S${k===SOC_NONE?"<br>ngày có đơn nhưng file linehaul không có chuyến trả về SOC":k===SOC_HUB?"<br>xe thả ở Hub hoặc điểm khác trước khi tới SOC":`<br>từ ${Object.keys(A.byPt[k]).length} điểm`}`)}" tabindex="0">
      <span class="nm">${esc(k)}</span><div class="sv-track"><div class="sv-bar" style="width:${(v/mx*100).toFixed(2)}%;${SOCX(k)?`background:${socCol(k)}`:""}"></div></div><span class="sv-val">${nfD(v)} · ${pctS(v,all)}</span></div>`).join("")}</div>
    <p class="note" style="margin:10px 0 0">Chỉ tính đơn D2S (Volume Tracker, ngày điểm chạy D2S). Hàng của Hub, điểm ngoài Volume Tracker hay hàng nhận ở SOC đi chung xe không được cộng vào, chỉ dùng để biết xe dỡ đơn D2S ở đâu. SOC là nơi xe trả hàng, chưa tính chuyển tiếp giữa các SOC.</p>${det}</div>`;}

/* ---------- popup một điểm: hàng về SOC nào + chuyến theo ngày ---------- */
function ptSocCard(i){const s=S[i],t=BASE.tot[i];if(!(t&&t.vol>0))return "";
  const tot={},days=[];let nTrip=0;
  ACT.forEach(d=>{const p=socSplit(i,d),L=(s.tc&&s.tc[d])||[];nTrip+=L.length;
    if(p)Object.entries(p).forEach(([k,v])=>{tot[k]=(tot[k]||0)+v;});
    const sum=p?Object.values(p).reduce((a,b)=>a+b,0):0;
    const tt=`<b>${dayLabel(d)}</b> · ${DTN[BASE.rows[i][d].t]}${p?` · ${f0(sum)} đơn D2S<br>${Object.entries(p).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)}: ${f0(v)}`).join("<br>")}`:"<br>không chạy D2S"}${L.length?`<br>${L.length} chuyến linehaul · bấm để xem`:""}`;
    days.push({d,parts:p||{},tt,trips:L.length?`${i}:${d}`:null});});
  const order=Object.entries(tot).sort((a,b)=>SOCX(a[0])-SOCX(b[0])||b[1]-a[1]).map(x=>x[0]),all=Object.values(tot).reduce((a,b)=>a+b,0)||1;
  const first=ACT.find(d=>s.tc&&s.tc[d]&&s.tc[d].length);
  return `<div class="card"><h3>Hàng về SOC nào · chuyến linehaul theo ngày <span class="mini">data thật, gốc</span></h3>
    <div class="sv-leg">${order.map(k=>`<span><i style="background:${socCol(k)}"></i>${esc(k)} <b>${nfD(tot[k])}</b> đơn/ngày · ${pctS(tot[k],all)}</span>`).join("")}</div>
    ${socCols(days,order,{aria:"Đơn D2S theo ngày, chia theo SOC"})}
    <p class="note" style="margin:8px 0 0">${f0(nTrip)} chuyến linehaul có ghé điểm này trong kỳ. Bấm một cột để xem các chuyến của ngày đó: lộ trình, đơn lên/xuống, giờ đến/đi.${first!=null?` <a href="#" data-trips="${i}:${first}">Xem từ ngày đầu</a>`:""}</p></div>`;}

/* =====================================================================
   SELLER MỚI — mô phỏng một NHÓM điểm (seller mới + các điểm đi cùng)
   · Mỗi điểm có hồ sơ riêng theo 3 loại ngày (BAU · Mini CP · CP).
   · Xe: tự tối ưu — thử mọi cách chia các điểm thành chuyến riêng / chuyến ghép, chọn tổng tiền xe thấp nhất
     (điểm "Ghép chung nhóm" luôn đi chung; "Đi riêng" luôn một mình; ké / Hub trả tách ra).
   · Người: chỉ các điểm CÙNG FM Hub mới dùng chung người được.
   · Cùng công thức với trang Ngưỡng ADO: nhóm N điểm giống nhau cho ra đúng số của ô tương ứng.
   ===================================================================== */
const NPT=[   // hàng của bảng hồ sơ: [khoá, nhãn, kiểu, đơn vị, nhóm]
 ["on","Có chạy D2S","chk","","Lịch & sản lượng"],
 ["ado","ADO","num","đơn/ngày","Lịch & sản lượng"],
 ["bk","% hàng to","num","%","Lịch & sản lượng"],
 ["ch","Số chute seller chia","int","chute","Chute, SOC & mốc COT"],
 ["st","Số SOC xe chở tới (SOC đầu chuyển tiếp nguyên túi các chute còn lại)","int","SOC","Chute, SOC & mốc COT"],
 ["req","Số chute theo luồng chuẩn (chia ít hơn → SOC đầu sort lại phần thiếu)","int","chute","Chute, SOC & mốc COT"],
 ["mt","Số mốc COT","int","mốc","Chute, SOC & mốc COT"],
 ["srt","Seller sort gì (tự suy ra từ số chute và SOC xe tới)","srt","","Sort tại seller"],
 ["sp","Mức đủ diện tích","num","%","Sort tại seller"],
 ["ho","Cách bàn giao","ho","","Sort tại seller"],
 ["tm","Cách đi xe","tm","","Cách đi xe"],
 ["md","1 xe ghé nhiều SOC","chk","","Cách đi xe"],
 ["veh","Loại xe","veh","","Cách đi xe"]];
const NP_INT=["req","ch","st","mt"],NP_MAX=5;
const NPTM=[["auto","Tự tối ưu"],["ghep","Ghép chung nhóm"],["rieng","Luôn đi riêng"],["ke","Ké xe FM/LM"],["hub","Hub trả tiền xe"]];
const NPLAB=[["auto","Tự chọn cách rẻ hơn"],["r","Mỗi điểm người riêng"],["c","Điểm cùng Hub dùng chung người"]];
const NPHUB=["Hub 1","Hub 2","Hub 3","Hub 4","Hub 5"];
let NP=null;

/* ---------- hồ sơ mặc định: điểm điển hình của vùng (giống trang Ngưỡng ADO) ---------- */
function npPoint(R,name){
  const P=BASE&&typeof thrProfile==="function"?thrProfile(R):null,rg=RG[R]||RBASE,idx=P?P.idx:[];
  const run=[0,1,2].map(t=>{const v=[];idx.forEach(i=>{let s=0,c=0;for(const d of ACT){const r=BASE.rows[i][d];if(r&&r.vol>0&&r.t===t){s+=r.vol;c++;}}if(c)v.push(s/c);});

    const beta=Math.min(100,Math.max(0,+pt["bk"+t]||0))/100,sb=pt["sb"+t]?1:0,mt=Math.max(1,+pt["mt"+t]||1);

function npInput(el){const np=getNP(),[w,k]=el.dataset.np.split(":");let v;
  if(el.type==="checkbox")v=el.checked?1:0;else if(el.tagName==="SELECT"||el.classList.contains("code"))v=el.value;
  else{v=parseFloat(String(el.value).replace(",","."));if(!isFinite(v))v=0;v=NP_INT.includes(k.slice(0,-1))?Math.max(1,Math.round(v)):Math.max(0,v);if(String(v)!==el.value)el.value=v;}
  if(w==="g"&&k==="F"){const f=FLOW[v];np.F=v;if(f)np.pts.forEach(pt=>[0,1,2].forEach(t=>Object.assign(pt,{["ch"+t]:f.ch,["st"+t]:f.st,["req"+t]:f.ch})));npSave();npThrMemo={};renderNew();toast(`Đã điền luồng ${f?f.n:v}: chia ${f?f.ch:"?"} chute, xe tới ${f?f.st:"?"} SOC.`);return;}
  if(w==="g"){if(k==="R"&&v!==np.R){NP=Object.assign(npDefaults(v),{lab:np.lab});npSave();renderNew();toast("Đã điền hồ sơ điển hình vùng "+v+".");return;}np[k]=v;}
  else np.pts[+w][k]=v;

function layer(i,mode){OV[i]=OV[i]||{s:{},d:{}};if(mode==="r"){OV[i].s=OV[i].s||{};OV[i].d=OV[i].d||{};return OV[i];}OV[i].w=OV[i].w||{s:{},d:{}};OV[i].w.s=OV[i].w.s||{};OV[i].w.d=OV[i].w.d||{};return OV[i].w;}
function afterEdit(i,mode){saveSeller(i);if(mode==="r")refreshAll();else scnSoon();}
function setOv(i,key,val){const mode=ui.em,L=layer(i,mode);const def=mode==="r"?defSeller(i)[key]:RES.set[i][key];
  if(JSON.stringify(def)===JSON.stringify(val))delete L.s[key];else L.s[key]=val;afterEdit(i,mode);}
function setDayOv(i,d,key,val,mode){mode=mode||ui.em;const L=layer(i,mode);const o=L.d[d]||{};
  if(val===null||val==="")delete o[key];else o[key]=val;if(Object.keys(o).length)L.d[d]=o;else delete L.d[d];afterEdit(i,mode);}
function parseDayVal(k,raw){raw=String(raw).trim();if(raw==="")return null;
  if(k==="veh"){return raw.toLowerCase()==="auto"?"auto":(vehBy(raw.toUpperCase())?raw.toUpperCase():undefined);}
  const v=parseFloat(raw.replace(",","."));if(!isFinite(v))return undefined;if(k==="on")return v?1:0;if(k==="ch"||k==="mt")return Math.max(1,Math.round(v));return Math.max(0,v);}

/* ---------- boot: lấy dữ liệu từ Apps Script rồi mới dựng trang ---------- */
var D=null;
function boot(){
  document.getElementById("boot").textContent="Đang tải dữ liệu từ Google Sheet…";
  google.script.run
    .withSuccessHandler(function(js){
      try{D=JSON.parse(js);}catch(e){document.getElementById("boot").textContent="Dữ liệu lỗi định dạng: "+e.message;return;}
      if(!D||!D.S||!D.S.length){document.getElementById("boot").textContent="Chưa có dữ liệu. Vào Google Sheet → menu D2S Simulation → Cập nhật dữ liệu ngay.";return;}
      document.getElementById("boot").hidden=true;
      document.getElementById("app").hidden=false;
      initApp();
    })
    .withFailureHandler(function(err){
      document.getElementById("boot").textContent="Không tải được dữ liệu: "+(err&&err.message||"lỗi")+". Kiểm tra ID file Volume Tracking trong Code.gs.";
    })
    .getData();
}
boot();
