     (số SOC đích × số lượt trong ngày). Ngày đó phải thêm xe vì xe đã đầy, nên mức đầy
     đo được ≈ sức chứa thật với hàng của điểm này.
   - Cần ≥ CAL_MIN ngày như vậy; lấy mức đầy cao (p90) của các ngày đó làm trần lấp đầy.
   - Chỉ HẠ mức lấp đầy (không bao giờ nâng quá mức chung). Người dùng sửa tay được. */

function calib(){
  const TY=D.TY||[];

    if(!Array.isArray(s.tr)||s.tt==="T3"||s.tt==="T4")return null;
    const legs=(s.mdSh!=null&&s.mdSh>=0.5)?1:Math.max(1,Math.round(s.nsMed||s.ns||1));
    const vb=[];let nd=0;
    for(let d=0;d<ND;d++){const tv=s.tr[d],v=s.v[d]||0;if(!Array.isArray(tv)||v<=0)continue;
      const beta=(s.b[d]||0)/v;let cap=0,tt=0;
      tv.forEach((x,j)=>{if(!(x>0))return;const vv=vehBy(TY[j]==="KHAC"?"VAN":TY[j]);tt+=x;if(vv&&vv.n>0&&vv.b>0)cap+=x/((1-beta)/vv.n+beta/vv.b);});
      if(cap<=0)continue;nd++;
      const wv=(s.wvd&&s.wvd[d])||s.wv||1,smin=legs*wv;
      if(tt>=smin+1&&tt>=smin*1.25)vb.push(Math.max(v,(s.to&&s.to[d])||0)/cap);}

}

/* ---------- engine ---------- */
const fStep=(ideal,act,step,rate)=>1-Math.round(Math.abs(ideal-act)/Math.max(step,1e-9))*rate/100;

/* Tìm điểm để ghép xe: cùng vùng, dùng chung SOC đích, và có ngày chạy trùng nhau */
function partnersFor(i,limit){
  const s=S[i],mine=new Set(s.soc||[]);
  if(!mine.size||RES.set[i].pay==="hub")return [];
  const myDays=new Set(ACT.filter(d=>RES.rows[i][d].vol>0));
  const out=[];
  S.forEach((o,j)=>{
    if(j===i||o.R!==s.R||!o.soc||!o.soc.length)return;
    if(RES.set[j].tm==="ke"||RES.set[j].pay==="hub")return;
    const shared=o.soc.filter(x=>mine.has(x));
    if(!shared.length)return;
    const both=ACT.filter(d=>myDays.has(d)&&RES.rows[j][d].vol>0).length;
    if(both<Math.max(3,myDays.size*0.5))return;
    const cover=shared.length/mine.size;
    const km=kmPt(i,j);if(km!=null&&G.truck.gKm>0&&km>G.truck.gKm)return;   // quá xa để ghép chung một chuyến
    out.push({j,shared,cover,both,ado:S[j].adoT[0],hubSame:!!(s.h&&s.h===o.h),km,det:detourKm(i,j,shared[0])});
  });
  // ưu tiên phủ hết SOC của mình, rồi tới điểm nhỏ (ghép vào đỡ phí xe nhất)
  out.sort((a,b)=>b.cover-a.cover||b.both-a.both||((a.km??1e9)-(b.km??1e9))||a.ado-b.ado);
  return out.slice(0,limit||12);
}

let MG={v:0,val:{},q:[],qs:new Set(),pa:{},man:new Set(),t:null};
function mgReset(){const pa={},man=new Set();(OUT?OUT.acts:[]).forEach(a=>a.pts.forEach(i=>{(pa[i]=pa[i]||[]).push(a.id);}));S.forEach((_,i)=>{if(edited(i))man.add(i);});
  clearTimeout(MG.t);MG={v:MG.v+1,val:{},q:[],qs:new Set(),pa,man,t:null};}
/* dòng này có bị điều chỉnh khác (hoặc chỉnh tay) trên cùng điểm làm đổi số không */
function mgNeed(a){return !!a&&a.pts.some(i=>MG.man.has(i)||(MG.pa[i]||[]).some(id=>id!==a.id));}
function netWith(acts){const kinds=new Set(acts.map(a=>a.k));OVX=compose(kinds,acts);let X;try{X=computeOnce(BASE);}finally{OVX=realityOv();}return X.tot.map(t=>t.net);}
/* dòng đang bật: tính theo THỨ TỰ BẬT — dòng bật sau chỉ được phần thêm so với các dòng bật trước, nên các dòng cộng lại đúng bằng kịch bản */

/* ô số bên phải mỗi dòng. m = kết quả tính thêm (null = đang tính / không cần); g, gi = ước khi bật riêng */
function agBox(id,m,pt,g,gi,k,lk){

    return `<div class="ag ${v>0?"pos":(v<0?"neg":"")}" data-mgk="${k}">${Math.abs(v)<5e4?"±0":sgT(v)}<small>${lab}</small></div>`;}

/* ---------- ước lượng từng điều chỉnh (so với gốc, bật riêng một mình) ---------- */

/* một cặp ghép, đo cả mạng: hai điểm được ghép + các điểm bị bỏ lại trên tuyến đang chạy của mỗi bên */
function pairSug(i,j,pt){const mem={truck:[i,j]},ai=ep(i,{tm:"ghep",mem}),aj=ep(j,{tm:"ghep",mem});if(!ai.n||!aj.n)return null;
  let gi={[i]:ai.net-nowNet(i),[j]:aj.net-nowNet(j)},g=gi[i]+gi[j],left=[],lg=0;
  const pn=pairNet(i,j);if(pn){gi=Object.assign({},pn.gi);g=pn.g;left=pn.left;lg=pn.lg;}
  const note=`Chung ${((pt&&pt.shared)||[]).join(", ")} · cùng chạy ${pt?pt.both:"?"} ngày`+(left.length?` · bỏ lại trên tuyến đang chạy: ${left.map(x=>shortN(S[x].n)).join(", ")} (${sgT(lg)} tr)`:"");

function leversFor(i,opt){opt=opt||{};

  if(!hubPay&&c.tm!=="ke"){const g=ep(i,{tm:"ke"}).net-now;if(g>2e5)out.push({id:actId.one("ke",i),k:"ke",pts:[i],g,gi:{[i]:g},note:"Trả phần chỗ chiếm trên xe FM/LM chạy sẵn"});}
  // ghép: các đối tác gần nhất
  (opt.partners&&!hubPay?partnersFor(i,opt.partners):[]).forEach(pt=>{const a=pairSug(i,pt.j,pt);if(a)out.push(a);});
  // vận hành
  const ht=hubTeam(i);if(ht){const T=teamSug(S[i].R,ht);if(T)out.push(T);}
  let bestCh=null;for(let k=1;k<=0;k++)if(k!==c.ch0){const g=ep(i,{ch:k}).net-ref;if(g>2e5&&(!bestCh||g>bestCh.g))bestCh={id:actId.lvl("ch",i,k),k:"ch",pts:[i],v:k,g,gi:{[i]:g},note:`Đang chia ${c.ch0} chute`};}
  if(bestCh)out.push(bestCh);
  if(c.mt>1){const lv=[];for(let m=c.mt-1;m>=1;m--){const g=ep(i,{mt:m}).net-ref;lv.push({v:m,g});}
    const best=lv.slice().sort((a,b)=>b.g-a.g)[0];
    if(best&&best.g>2e5)out.push({id:actId.lvl("mt",i,best.v),k:"mt",pts:[i],v:best.v,g:best.g,gi:{[i]:best.g},levels:lv,note:`Đang ${c.mt} mốc/ngày`});}
  if(0){const g=ep(i,{sb:0}).net-ref;if(g>2e5)out.push({id:actId.one("sb",i),k:"sb",pts:[i],g,gi:{[i]:g},note:"Hàng to để nguyên, SOC chia"});}

const teamCache={};
function teamSug(R,ht){const key=R+"|"+ht;if(key in teamCache)return teamCache[key];

  if(mem.length<2||mem.every(i=>RES.set[i].team===ht))return teamCache[key]=null;   // hub đã đi vòng trong gốc
  const alone=groupLabor(mem,false),pooled=groupLabor(mem,true),g=alone-pooled;

    act.forEach(j=>{const w=RES.rows[j][d].w;hcA+=w>0?Math.max(L.minHC,Math.ceil(w-1e-9)):0;});
    const W=act.reduce((a,j)=>a+RES.rows[j][d].w,0);hcP+=W>0?Math.max(L.minHC,Math.ceil(W*(1+(act.length>1?L.ovh/100:0))-1e-9)):0;}

/* ---------- danh sách đề xuất cho bước 3 (điểm đang lỗ + đi cùng) ---------- */
function buildSug(){
  Object.keys(teamCache).forEach(k=>delete teamCache[k]);
  const list=[],seen=new Set();const add=a=>{if(!a||seen.has(a.id))return;seen.add(a.id);list.push(a);};
  const losing=S.map((_,i)=>i).filter(i=>RES.cls[i]&&RES.cls[i].vol>0&&RES.cls[i].net<=0);
  losing.forEach(i=>leversFor(i).forEach(add));
  // cặp ghép: theo ghép tham lam toàn mạng của bộ phân tích
  S.forEach((s,i)=>{const P=RES.cls[i]&&RES.cls[i].plan;if(!P||!P.match)return;const j=P.match.other;if(i>j&&RES.cls[j].plan&&RES.cls[j].plan.match)return;
    add(pairSug(i,j,P.match.pt));});
  // mạng lưới: tuyến xe và nhóm người tối ưu cho cả vùng
  const NP=REG.map(netPlan);NP.forEach(P=>{P.tp.forEach(add);P.lp.forEach(add);});
  // nhóm người: mọi nhóm hub có lợi
  const hk=new Set();S.forEach((s,i)=>{const ht=hubTeam(i);if(ht)hk.add(s.R+SEP+ht);});
  hk.forEach(k=>{const [R,ht]=k.split(SEP);const T=teamSug(R,ht);if(T&&T.g>1e5)add(T);});
  /* bộ đề xuất = kế hoạch MẠNG trước (tuyến xe + nhóm người cho cả vùng), rồi phần còn lại theo từng điểm:
     điểm đang lỗ không nằm trong tuyến mạng nào thì đổi cỡ xe / 1 xe nhiều SOC nếu có lợi */
  const rec=new Set(),inNetT=new Set(),inNetL=new Set();
  NP.forEach(P=>{P.tp.forEach(p=>{rec.add(p.id);p.pts.forEach(i=>inNetT.add(i));});P.lp.forEach(p=>{rec.add(p.id);p.pts.forEach(i=>inNetL.add(i));});});
  S.forEach((s,i)=>{const P=RES.cls[i]&&RES.cls[i].plan;if(!P)return;
    if(!inNetT.has(i)){if(P.truck.k==="size")rec.add(actId.one("size",i));
      else if(P.truck.k==="md"){rec.add(actId.one("size",i));rec.add(actId.one("md",i));}}

function sug(){if(!SUG)buildSug();return SUG;}

/* ================= MẠNG LƯỚI: tối ưu cả vùng thay vì từng điểm =================
   Mỗi điểm D2S là một nút. Cạnh giữa hai điểm:
   - đi chung chuyến thật (file linehaul) · chung SOC đích · cùng ngày chạy · gần nhau (tọa độ Station) → ghép được xe
   - chung FM Hub, hoặc khác hub nhưng rất gần → dùng chung được một nhóm người đi vòng
   Hai lớp tính riêng vì chi phí tách được: XE (tuyến: ai đi chung chuyến với ai) và NGƯỜI (nhóm người đi vòng).
   Thuật toán cho mỗi vùng: bắt đầu từ mạng đang chạy (gốc), mỗi vòng thử mọi nước đi — gộp hai tuyến, chuyển một điểm
   sang tuyến khác, đổi chỗ hai điểm, tách một điểm ra — và làm nước lời nhất cho CẢ VÙNG, tới khi không còn nước nào lời.
   Được phép cắt tuyến đang chạy và lập tuyến nhiều điểm (tối đa G.truck.stops điểm lấy hàng một chuyến).
   Kết quả gom thành "gói": tuyến/nhóm mới cùng tuyến/nhóm cũ bị cắt. Tác động của gói = tổng lãi/lỗ MỌI điểm trong gói,
   kể cả điểm bị bỏ lại khi đối tác của nó chuyển sang tuyến khác. */
const NET={};
function netReset(){for(const k in NET)delete NET[k];}
/* số chuyến thật trong kỳ có cả hai điểm */
function coTrips(){if(NET.co)return NET.co;
  const act=new Set(ACT),ix={};S.forEach((s,i)=>{ix[s.n.trim()]=i;});const n={},co={};
  for(const code in TRP){const t=TRP[code];if(!act.has(t[0]))continue;
    const pts=[...new Set(t[5].filter(p=>p[1]===0).map(p=>ix[String(TRN[p[0]]).trim()]).filter(x=>x!=null))];
    pts.forEach(i=>{n[i]=(n[i]||0)+1;});
    for(let a=0;a<pts.length;a++)for(let b=a+1;b<pts.length;b++){const k=Math.min(pts[a],pts[b])+"-"+Math.max(pts[a],pts[b]);co[k]=(co[k]||0)+1;}}
  return NET.co={n,co};}
const coOf=(i,j)=>coTrips().co[Math.min(i,j)+"-"+Math.max(i,j)]||0;
const srtN=a=>a.slice().sort((x,y)=>x-y);
const gkey=g=>srtN(g).join(",");
/* nhóm xe gốc của một điểm: cùng mã ghép (tg) thì chung chuyến; còn lại đi riêng */
const tKeyOf=i=>{const c=BASE.set[i];return c.tm==="ghep"&&c.tg?"G|"+S[i].R+"|"+c.tg:"i|"+i;};
const netTNode=i=>{const c=BASE.set[i];return BASE.tot[i].vol>0&&c.pay!=="hub"&&c.tm!=="ke";};
function netTBase(R){const g={};S.forEach((s,i)=>{if(s.R===R&&netTNode(i))(g[tKeyOf(i)]=g[tKeyOf(i)]||[]).push(i);});return Object.values(g).map(srtN);}
/* tiền xe mô hình của từng điểm trong một chuyến chung, một ngày (giống computeOnce) */
function grpModel(act,d){let nb=0,b=0,kk=1,md=true,vk=null,vsame=true,mt=1;const fp=[];
  act.forEach(i=>{const r=BASE.rows[i][d],c=BASE.set[i];nb+=r.nb;b+=r.bk;kk=Math.max(kk,r.st||1);md=md&&!!c.md;mt=Math.max(mt,r.mt||1);
    fp.push({nb:r.nb,b:r.bk,fl:flx(c.fl)});if(vk===null)vk=r.vk;else if(vk!==r.vk)vsame=false;});
  const x=truckCost(nb,b,kk,md,vsame?vk:"auto",act.length,mt,false,grpFl(fp),routeKm(act)),U=spaceU(nb,b),o={};
  act.forEach(i=>{const r=BASE.rows[i][d],sh=U>0?spaceU(r.nb,r.bk)/U:1/act.length;o[i]=x.base*sh+x.sur/act.length;});return o;}
/* tiền xe cả kỳ của một tuyến (nhóm điểm đi chung chuyến): tổng và từng điểm.
   netTM: thuần mô hình cho mọi tuyến → dùng để TÌM mạng (so công bằng, không lẫn chênh lệch chuyến thật/mô hình).
   netTC: như khi bật ở kịch bản → số hiện trên trang. Tuyến gốc giữ nguyên: tiền xe thật. Tuyến đổi: tiền xe thật của từng điểm
   + (mô hình tuyến mới − mô hình tuyến gốc), tức chỉ cộng phần do đổi cấu trúc, không lẫn phần đổi cỡ xe (đã có dòng riêng). */
function netTM(g){const key=gkey(g),C=NET.tm||(NET.tm={});if(key in C)return C[key];
  const per={};g.forEach(i=>{per[i]=0;});
  for(const d of ACT){const act=g.filter(i=>BASE.rows[i][d].vol>0);if(!act.length)continue;const m=grpModel(act,d);act.forEach(i=>{per[i]+=m[i];});}
  let tot=0;g.forEach(i=>{tot+=per[i];});return C[key]={tot,per};}
function netTC(g){const key=gkey(g),C=NET.tc||(NET.tc={});if(key in C)return C[key];
  const per={};g.forEach(i=>{per[i]=0;});const real=G.truckSrc==="real";
  const full=g.every(i=>tKeyOf(i)===tKeyOf(g[0]))&&g.length===S.filter((_,j)=>netTNode(j)&&tKeyOf(j)===tKeyOf(g[0])).length;
  for(const d of ACT){const act=g.filter(i=>BASE.rows[i][d].vol>0);if(!act.length)continue;
    if(full){act.forEach(i=>{per[i]+=BASE.rows[i][d].truck;});continue;}
    const m=grpModel(act,d);
    act.forEach(i=>{const r=BASE.rows[i][d];per[i]+=real&&r.src==="real"&&r.opt?Math.max(0,r.real+m[i]-r.opt.c):m[i];});}
  let tot=0;g.forEach(i=>{tot+=per[i];});return C[key]={tot,per};}
/* ghép được xe: chung SOC đích, chạy trùng ngày, không quá xa — hoặc đang đi chung chuyến thật */
function netTOk(i,j){const K=NET.tok||(NET.tok={}),k=Math.min(i,j)+"-"+Math.max(i,j);if(k in K)return K[k];
  let ok=(S[i].soc||[]).some(x=>(S[j].soc||[]).includes(x));
  if(ok){const di=ACT.filter(d=>BASE.rows[i][d].vol>0),dj=new Set(ACT.filter(d=>BASE.rows[j][d].vol>0)),both=di.filter(d=>dj.has(d)).length;
    ok=both>=Math.max(3,0.5*Math.min(di.length,dj.size));}
  const km=kmPt(i,j);if(ok&&km!=null&&G.truck.gKm>0&&km>G.truck.gKm)ok=false;
  if(!ok&&coOf(i,j)>=3)ok=true;

/* nhóm người gốc: cùng mã đội (team) thì chung người */

/* tìm kiếm cục bộ trên cả vùng: mỗi vòng làm nước đi giảm tổng chi phí nhiều nhất */

    const tryMv=(d,f)=>{if(d<-minG&&(!best||d<best.d))best={d,f};};
    for(let a=0;a<P.length;a++)for(let b=a+1;b<P.length;b++){const A=P[a],B=P[b];if(A.length+B.length>maxN)continue;
      if(!A.some(i=>nb[i].some(j=>gm[j]===b))||!A.every(i=>okAll(i,B)))continue;

/* gom thay đổi thành gói độc lập: tuyến/nhóm mới + tuyến/nhóm gốc bị cắt, nối với nhau qua điểm chung */
function netPacks(P0,P,cost,costM){const bK=new Set(P0.map(gkey)),fK=new Set(P.map(gkey));

let loaded=false;const pend={},getters={},dirty=new Set();
function setSave(t){const el=$("saveState");if(el)el.textContent=t;}
function lsSave(){try{localStorage.setItem("d2s-sp-state",JSON.stringify({G,RG,OV,socAlways,SC,SCN}));}catch(e){}}
function writeNow(path){clearTimeout(pend[path]);delete pend[path];if(!loaded)return;
  const payload=JSON.stringify(getters[path]());
  google.script.run
    .withSuccessHandler(()=>setSave(Object.keys(pend).length?"Đang lưu…":"Đã lưu vào Google Sheet"))
    .withFailureHandler(err=>setSave("Chưa lưu được: "+(err&&err.message||"lỗi")))
    .saveConfig(path,payload);}
function queue(path,getter){getters[path]=getter;lsSave();
  if(!loaded){dirty.add(path);setSave("Đang tải dữ liệu, thay đổi sẽ lưu khi tải xong");return;}
  clearTimeout(pend[path]);setSave("Đang lưu…");pend[path]=setTimeout(()=>writeNow(path),600);}
const saveCfg=()=>queue("cfg",()=>({G:clone(G),RG:clone(RG),socAlways,SC:clone(SC)}));

  ["save","truck","soc","lab","prod"].forEach(g=>Object.keys(G[g]).forEach(k=>{if(typeof DEFG[g][k]==="number"&&!isFinite(G[g][k]))G[g][k]=DEFG[g][k];}));if(x.G.truckSrc)G.truckSrc=x.G.truckSrc;if(x.G.cal&&typeof x.G.cal==="object")G.cal=x.G.cal;if(Array.isArray(x.G.veh))G.veh=x.G.veh;}
  if(x.RG){RG=clone(DEFRG);REG.forEach(R=>{if(x.RG[R])Object.keys(RBASE).forEach(k=>{if(x.RG[R][k]!=null)RG[R][k]=x.RG[R][k];});});}

  for(let s=1;s<st.length;s++){const v=sumNet(st[s].X,idx);rows.push({k:st[s].k,d:v-prev,after:v});prev=v;}
  return {base,fin:prev,rows};}

/* số liệu khoảng cách bổ trợ cho từng điều chỉnh (tọa độ sheet Station) */
function geoNote(a){const km=v=>v==null?"?":f1(v)+" km",i=a.pts[0];

/* ================= TRỰC QUAN KẾ HOẠCH MẠNG =================
   Bản đồ theo tọa độ thật (Trước · Sau · So sánh; lớp Xe hoặc Người), dumbbell chỉ số trước → sau,
   dòng chảy tuyến cũ → tuyến mới, cầu lãi/lỗ theo gói. Phạm vi = vùng đang chọn; có ô lọc thì chỉ lấy
   các điểm khớp cùng mọi điểm đi chung tuyến/nhóm với chúng (trước hoặc sau). */
const NVCOL=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)","var(--s8)"];
const nvAdo=i=>{const t=BASE.tot[i];return t&&t.run?t.vol/t.run:0;};
const socMain=g=>{const c={};g.forEach(i=>{const x=(S[i].soc||[])[0];if(x)c[x]=(c[x]||0)+1;});return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||null;};
/* thứ tự lấy hàng trong tuyến (giống routeKm): điểm xa SOC nhất trước, rồi điểm gần nhất tiếp theo */
function routeOrder(g){const soc=socMain(g);if(g.length<2||!soc)return g.slice();const dS=i=>kmTo(i,soc);if(g.some(i=>dS(i)==null))return g.slice();
  let cur=g.slice().sort((a,b)=>dS(b)-dS(a))[0];const out=[cur],left=g.filter(x=>x!==cur);
  while(left.length){left.sort((a,b)=>kmPt(cur,a)-kmPt(cur,b));cur=left.shift();out.push(cur);}return out;}
/* số chuyến/ngày theo mô hình của một tuyến */
function nvTrips(g){const K=NET.trp||(NET.trp={}),key=gkey(g);if(key in K)return K[key];let t=0,n=0;
  for(const d of ACT){const act=g.filter(i=>BASE.rows[i][d].vol>0);if(!act.length)continue;n++;let nb=0,b=0,kk=1,md=true,mt=1;const fp=[];
    act.forEach(i=>{const r=BASE.rows[i][d],c=BASE.set[i];nb+=r.nb;b+=r.bk;kk=Math.max(kk,r.st||1);md=md&&!!c.md;mt=Math.max(mt,r.mt||1);fp.push({nb:r.nb,b:r.bk,fl:flx(c.fl)});});
    t+=truckCost(nb,b,kk,md,"auto",act.length,mt,false,grpFl(fp)).t;}
  return K[key]=t/Math.max(1,ACT.length);}
function nvHc(g){let s=0;for(const d of ACT){const q=g.filter(i=>BASE.rows[i][d].vol>0),W=q.reduce((a,i)=>a+BASE.rows[i][d].w,0);
  s+=W>0?Math.max(G.lab.minHC,Math.ceil(W*(g.length>1&&q.length>1?1+G.lab.ovh/100:1)-1e-9)):0;}return s/Math.max(1,ACT.length);}
/* phạm vi đang xem: vùng + ô lọc (+ điểm đi chung trước/sau) */
function nvScope(P){const q=(ui.q3||"").toLowerCase();const all=new Set(P.T0.flat().concat(P.L0.flat()));
  if(!q)return {pts:[...all],q:false};const hit=[...all].filter(i=>S[i].n.toLowerCase().includes(q));const sc=new Set(hit);
  [P.T0,P.T1,P.L0,P.L1].forEach(Ps=>Ps.forEach(g=>{if(g.some(i=>hit.includes(i)))g.forEach(i=>sc.add(i));}));return {pts:[...sc],q:true,hit};}
function nvState(){const Rs=REG.filter(R=>ui.reg==="all"||R===ui.reg).filter(R=>{const P=netPlan(R);return P.T0.length||P.L0.length;});
  if(!Rs.length)return null;let R=ui.reg!=="all"?ui.reg:(Rs.includes(ui.netR)?ui.netR:Rs.slice().sort((a,b)=>{const x=netPlan(a),y=netPlan(b);return (y.tg+y.lg)-(x.tg+x.lg);})[0]);
  const P=netPlan(R);return {R,Rs,P,sc:nvScope(P),L:ui.netL||"xe",sel:""};}
/* ---------- dumbbell chỉ số trước → sau ---------- */
function nvDumb(st){const {P,sc}=st,inS=new Set(sc.pts);
  const T0=P.T0.filter(g=>g.some(i=>inS.has(i))),T1=P.T1.filter(g=>g.some(i=>inS.has(i))),L0=P.L0.filter(g=>g.some(i=>inS.has(i))),L1=P.L1.filter(g=>g.some(i=>inS.has(i)));
  const net0=sc.pts.reduce((a,i)=>a+BASE.tot[i].net,0),gi=i=>P.tp.concat(P.lp).reduce((a,x)=>a+((x.gi&&x.gi[i])||0),0),net1=net0+sc.pts.reduce((a,i)=>a+gi(i),0);
  const km=Ps=>Ps.reduce((a,g)=>a+routeKm(g)*nvTrips(g),0);
  const rows=[["Chuyến xe/ngày",T0.reduce((a,g)=>a+nvTrips(g),0),T1.reduce((a,g)=>a+nvTrips(g),0),-1,f1,"mô hình, cả tuyến"],
    ["Điểm đi riêng",T0.filter(g=>g.length===1).length,T1.filter(g=>g.length===1).length,-1,f0,"điểm không ghép với ai"],
    ["Km đi vòng/ngày",km(T0),km(T1),-1,f0,"để lấy thêm điểm"],
    ["Người/ngày",L0.reduce((a,g)=>a+nvHc(g),0),L1.reduce((a,g)=>a+nvHc(g),0),-1,f1,"người sort ở các điểm"],
    ["Lãi/lỗ (tr/kỳ)",net0/1e6,net1/1e6,1,f1,"ước theo từng gói"]];
  return `<div class="nv-dumb">${rows.map(([lab,a,b,good,fm,sub])=>{const lo=Math.min(a,b,0),hi=Math.max(a,b,0),sp=hi-lo||1,px=v=>((v-lo)/sp*100).toFixed(2);
    const better=(b-a)*good>0,same=Math.abs(b-a)<1e-9;
    return `<div class="nv-drow"><div class="nv-dlab">${lab}<span>${sub}</span></div>

function manualSummary(i,mode){const o0=OV[i]||{},o=mode==="r"?o0:(o0.w||{}),s=o.s||{},d=o.d||{};const p=[];

  const nd=Object.keys(d).length;if(nd)p.push(nd+" ngày chỉnh riêng");return p.join(" · ");}

  if(c.ns>1&&!c.md)b.push(`Hàng về <b>${c.ns} SOC</b>, mỗi SOC một chuyến riêng${c.mt>1?`, lại chia <b>${c.mt} mốc COT</b>`:""} → mỗi ngày trả khoảng <b>${c.ns*c.mt} lần</b> phí xe cố định.`);
  else if(c.mt>1)b.push(`Chia <b>${c.mt} mốc COT</b> trong ngày nên mỗi lượt xe chỉ chở một phần hàng.`);

/* ================= POPUP: một điều chỉnh ================= */
function findAct(id){const a=parseAct(id);if(!a)return null;
  const inS=sug().list.find(x=>x.id===id);if(inS)return inS;
  for(const i of a.pts){const e=levOf(i).find(x=>x.id===id);if(e)return e;}
  if(a.k==="mt"){const e=levOf(a.pts[0]).find(x=>x.k==="mt");if(e&&e.levels){const l=e.levels.find(l=>l.v===a.v);if(l)return Object.assign({},e,{id,v:a.v,g:l.g,gi:{[a.pts[0]]:l.g}});}}
  return Object.assign({g:0,gi:{}},a);}
MR.act=m=>{const a=findAct(m.id);if(!a)return {title:"Không tìm thấy",body:""};const K=KIND[a.k],on=isOn(m.id);
  const PT=a.pts.concat(a.left||[]),rows=PT.map(i=>{const g=(a.gi&&a.gi[i])||0;return `<tr class="click" data-pt="${i}"><td class="l rowname">${esc(S[i].n)}<span class="mini">${S[i].R}${S[i].h?" · "+esc(S[i].h):""}${netWhere(a,i)}</span></td><td class="num ${cls(BASE.tot[i].net)}">${trS(BASE.tot[i].net)}</td><td class="num ${cls(BASE.tot[i].net+g)}">${trS(BASE.tot[i].net+g)}</td><td class="num ${cls(g)}">${sgT(g)}</td><td class="num ${cls(OUT.X.tot[i].net)}">${trS(OUT.X.tot[i].net)}</td></tr>`;}).join("");
  const kindNote={net:"Tuyến do bộ tối ưu mạng lưới đề xuất. Số bên phải gồm mọi điểm trong gói, kể cả điểm bị cắt khỏi tuyến đang chạy.",nett:"Nhóm người do bộ tối ưu mạng lưới đề xuất. Người của nhóm đi vòng các điểm; tiền người chia theo khối lượng việc.",ghep:"Hai điểm dùng chung xe tới SOC chung. Tiền xe chia theo chỗ chiếm, cộng phụ phí ghép điểm.",size:"Giữ cách chạy (số SOC, số mốc) nhưng chọn loại và số xe vừa lượng hàng từng ngày, thay cho chuyến thật.",md:"Một xe ghé lần lượt các SOC thay vì mỗi SOC một chuyến, cộng phụ phí mỗi SOC thêm.",ke:"Không thuê xe riêng; trả phần chỗ chiếm trên xe FM/LM chạy sẵn cộng phí dừng.",team:"Hub bố trí một nhóm người dùng chung cho các điểm của Hub thay cho mỗi điểm một nhóm. Cộng hao hụt di chuyển, làm tròn một lần cho cả nhóm.",ch:"Đổi số chute seller chia. Ít chute sort nhanh hơn nhưng phát sinh chia lại ở SOC.",mt:"Giảm số lần bàn giao trong ngày, mỗi lần xe chở nhiều hơn.",sb:"Hàng to không sort ở điểm, SOC chia."}[a.k];
  return {title:esc(K.n),sub:esc(actLabel(a)),size:"md",body:`
    <div class="row" style="margin:0 0 10px">${(()=>{const pa=parseAct(m.id),lk=pa?lockOf(pa):null;return lk?`<label class="sw"><input type="checkbox" disabled aria-label="Bật"><span></span></label><b>Đang khoá</b><span class="mini lockn">${esc(lk)}</span>`:`<label class="sw"><input type="checkbox" data-tog="${esc(m.id)}"${on?" checked":""} aria-label="Bật"><span></span></label><b>${on?"Đang bật trong kịch bản":"Đang tắt"}</b>`;})()}${K.cond?`<span class="cond">cần xác nhận</span>`:""}</div>
    <p class="note" style="margin-top:0"><b>Gồm:</b> ${esc(KINC[a.k]||"")}.<br>${kindNote}${K.cond?` <b>Cần xác nhận:</b> ${esc(K.cond)}`:""}</p>
    ${a.k==="team"?`<dl class="kv" style="max-width:420px;margin:10px 0"><dt>Người/ngày của nhóm điểm</dt><dd>${f1(a.hcB)} → ${f1(a.hcA)}</dd><dt>Tiền người cả nhóm, cả kỳ</dt><dd>${sg(-a.g)} tr</dd></dl>`:""}
    ${a.k==="ghep"&&a.pt?`<p class="note">Chung ${esc((a.pt.shared||[]).join(", "))} · cùng chạy ${a.pt.both} ngày trong kỳ.</p>`:""}
    ${(()=>{const gn=geoNote(a);return gn?`<p class="note">Khoảng cách: ${esc(gn.t)}${gn.far?" — khá xa, cần kiểm tra tuyến thực tế":""}. Tính theo tọa độ sheet Station, đường chim bay × 1,3.</p>`:"";})()}
    <div class="tablewrap"><table class="data"><thead><tr><th>Điểm</th><th>Gốc (tr)</th><th>Nếu chỉ bật dòng này</th><th>Thay đổi</th><th>Kịch bản hiện tại</th></tr></thead><tbody>${rows}</tbody>
      ${PT.length>1?`<tfoot><tr class="tot"><td>Cộng</td><td class="num">${trS(sumNet(BASE,PT))}</td><td class="num">${trS(sumNet(BASE,PT)+(a.g||0))}</td><td class="num ${cls(a.g)}">${sgT(a.g||0)}</td><td class="num">${trS(sumNet(OUT.X,PT))}</td></tr></tfoot>`:""}</table></div>
    ${a.left&&a.left.length?`<p class="note">Điểm bị bỏ lại trên tuyến đang chạy (đã tính vào số trên): ${esc(a.left.map(x=>S[x].n).join(", "))}.</p>`:""}${["ghep","team","net","nett"].includes(a.k)?`<h3 style="margin:14px 0 6px;font-size:14px">Quan hệ hub · điểm · SOC</h3>${mapSvg(PT,{preview:a})}`:""}`};};

/* ================= POPUP: bản đồ một hub ================= */
MR.hub=m=>{const pts=S.map((_,i)=>i).filter(i=>(S[i].h||"(chưa gắn hub)")===m.h&&((BASE.tot[i].vol>0)||(OUT.X.tot[i].vol>0)));
  const X=OUT.X,more=new Set(pts);pts.forEach(i=>{const c=X.set[i];if(c.tm==="ghep"&&c.tg)S.forEach((_,j)=>{if(X.set[j].tm==="ghep"&&X.set[j].tg===c.tg&&S[j].R===S[i].R)more.add(j);});});
  const all=[...more];const hb=hubStats(BASE,pts),hf=hubStats(X,pts);
  return {title:esc(m.h),sub:`${pts.length} điểm của hub · người/ngày ${f1(hb)} → ${f1(hf)} · lãi/lỗ các điểm ${trS(sumNet(BASE,pts))} → ${trS(sumNet(X,pts))} tr`,body:`${mapSvg(all,{})}
    <div class="tablewrap" style="margin-top:12px"><table class="data"><thead><tr><th>Điểm</th><th>Gốc (tr)</th><th>Kịch bản (tr)</th><th>Thay đổi</th><th>Người/ngày</th><th style="text-align:left">Điều chỉnh</th></tr></thead><tbody>
    ${all.map(i=>{const b=BASE.tot[i],f=X.tot[i];return `<tr class="click" data-pt="${i}"><td class="l rowname">${esc(S[i].n)}${!pts.includes(i)?'<span class="mini">hub khác, ghép xe</span>':""}</td><td class="num ${cls(b.net)}">${trS(b.net)}</td><td class="num ${cls(f.net)}">${trS(f.net)}</td><td class="num ${cls(f.net-b.net)}">${sgT(f.net-b.net)}</td><td class="num">${f1(b.hc/Math.max(1,b.run))} → ${f1(f.hc/Math.max(1,f.run))}</td><td class="l"><span class="mini" style="white-space:normal">${actsTouching(i).map(a=>KIND[a.k].sh).join(" · ")||"–"}</span></td></tr>`;}).join("")}</tbody></table></div>`};};

/* sơ đồ 3 cột: hub → điểm → SOC. Cạnh đổi màu theo kịch bản */
function mapSvg(pts,opt){opt=opt||{};const X=OUT.X,pv=opt.preview;
  const hubs=[...new Set(pts.map(i=>S[i].h||"(chưa gắn hub)"))],socs=[...new Set(pts.flatMap(i=>S[i].soc||[]))];
  const rowH=34,n=Math.max(hubs.length,pts.length,socs.length,2),H=48+n*rowH,W=820;
  const yOf=(k,len)=>40+(k+0.5)*(n*rowH/len);
  const HX=[16,176],PX=[262,560],SX=[650,804];
  const truckOf=i=>{if(pv&&pv.k==="ghep"&&pv.pts.includes(i))return {tm:"ghep",tg:"PV"};if(pv&&pv.k==="net"&&pv.pts.includes(i))return {tm:"ghep",tg:"PV"+pv.gs.findIndex(g=>g.includes(i))};if(pv&&pv.k==="ke"&&pv.pts.includes(i))return {tm:"ke"};const c=X.set[i];return {tm:c.tm,tg:c.tg};};
  const teamOf=i=>(pv&&pv.k==="team"&&pv.pts.includes(i))?pv.ht:(pv&&pv.k==="nett"&&pv.pts.includes(i))?(pv.gs.find(g=>g.includes(i)).length>1?"NT":""):X.set[i].team;
  let e="",nodes="";
  pts.forEach((i,k)=>{const y=yOf(k,pts.length),h=hubs.indexOf(S[i].h||"(chưa gắn hub)"),yh=yOf(h,hubs.length),tm=teamOf(i);
    e+=`<path d="M${HX[1]},${yh} C${HX[1]+50},${yh} ${PX[0]-50},${y} ${PX[0]},${y}" style="fill:none;stroke:${tm?"var(--seg-seller)":"var(--line)"};stroke-width:${tm?2.2:1.2}${tm?";stroke-dasharray:5 3":""}"/>`;
    const T=truckOf(i),mates=T.tm==="ghep"?pts.filter(j=>j!==i&&truckOf(j).tm==="ghep"&&truckOf(j).tg===T.tg):[];
    (S[i].soc||[]).forEach(sc=>{const ys=yOf(socs.indexOf(sc),socs.length),shared=mates.some(j=>(S[j].soc||[]).includes(sc));
      e+=`<path d="M${PX[1]},${y} C${PX[1]+45},${y} ${SX[0]-45},${ys} ${SX[0]},${ys}" style="fill:none;stroke:${shared?"var(--seg-truck)":T.tm==="ke"?"var(--warn)":"var(--line)"};stroke-width:${shared?2.8:1.2}${T.tm==="ke"?";stroke-dasharray:3 3":""}"/>`;});
    const b=BASE.tot[i].net,f=pv?b+((pv.gi&&pv.gi[i])||0):X.tot[i].net,d=f-b,nm=S[i].n.length>34?S[i].n.slice(0,33)+"…":S[i].n;
    nodes+=`<g data-pt="${i}" style="cursor:pointer"><rect x="${PX[0]}" y="${y-12}" width="${PX[1]-PX[0]}" height="24" rx="5" style="fill:var(--panel);stroke:${Math.abs(d)>=5e4?(d>0?"var(--profit)":"var(--loss)"):"var(--line)"};stroke-width:1.2"/>
      <text x="${PX[0]+8}" y="${y+4}" class="map-t">${esc(nm)}</text><text x="${PX[1]-8}" y="${y+4}" text-anchor="end" class="map-s" style="fill:${Math.abs(d)>=5e4?(d>0?"var(--profit)":"var(--loss)"):"var(--muted)"}">${Math.abs(d)>=5e4?sg(d):trS(b)}</text></g>`;});
  hubs.forEach((h,k)=>{const y=yOf(k,hubs.length),nm=h.length>24?h.slice(0,23)+"…":h;nodes+=`<rect x="${HX[0]}" y="${y-12}" width="${HX[1]-HX[0]}" height="24" rx="12" style="fill:var(--panel-2);stroke:var(--line)"/><text x="${HX[0]+10}" y="${y+4}" class="map-t">${esc(nm)}</text>`;});
  socs.forEach((sc,k)=>{const y=yOf(k,socs.length),nm=sc.length>20?sc.slice(0,19)+"…":sc;nodes+=`<rect x="${SX[0]}" y="${y-12}" width="${SX[1]-SX[0]}" height="24" rx="3" style="fill:var(--panel-2);stroke:var(--line)"/><text x="${SX[0]+8}" y="${y+4}" class="map-t">${esc(nm)}</text>`;});
  return `<div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sơ đồ hub, điểm và SOC"><text x="${HX[0]}" y="20" class="map-h">FM HUB</text><text x="${PX[0]}" y="20" class="map-h">ĐIỂM D2S${pv?" · NẾU BẬT":" · KỊCH BẢN"}</text><text x="${SX[0]}" y="20" class="map-h">SOC ĐÍCH</text>${e}${nodes}</svg></div>
    <div class="keys"><span><i style="background:var(--seg-seller)"></i>nét đứt xanh lá: dùng chung người</span><span><i style="background:var(--seg-truck)"></i>nét đậm xanh dương: xe chung tới SOC</span><span><i style="background:var(--warn)"></i>chấm: ké xe FLM</span><span>viền điểm xanh/đỏ: lời thêm/lỗ thêm so với gốc</span></div>`;}

  lab:["Tiền người",`<p>Người của Hub qua điểm làm hết việc: đơn phải sort ÷ năng suất sort, cộng đơn không sort (chỉ quét, bàn giao, xếp xe) ÷ ${f0(handP())} đơn/người/ngày, làm tròn lên, tối thiểu ${G.lab.minHC} người mỗi ngày chạy. Dùng chung người thì cộng khối lượng các điểm, cộng ${G.lab.ovh}% hao hụt, làm tròn một lần rồi chia theo khối lượng. Lương FTE ${f0(G.lab.payF/1e3)}k, BPO ${f0(G.lab.payB/1e3)}k một ngày.</p>`],
  soc:["Chia lại ở SOC",`<p>Phát sinh khi seller chia ít chute hơn luồng chuẩn của vùng: phần hàng (chuẩn − chia) ÷ chuẩn phải được SOC đầu sort lại, tính theo năng suất và tiền một người ở SOC trong Cấu hình.${socAlways?` Đang bật thêm: ${G.soc.al}% hàng về sai, ${G.soc.be}% trong đó phải chia tay ở SOC, cho mọi điểm.`:""}</p>`],
  trip:["Chuyến theo plan, adhoc, in-house",`<p><b>Theo plan (Schedule)</b>: chuyến đã xếp lịch trước. <b>Adhoc</b>: chuyến gọi thêm ngoài plan — tỷ lệ adhoc cao nghĩa là plan chưa khớp lượng hàng, dễ điều chỉnh (ghép, đổi cỡ xe) vì chưa bị ràng buộc bởi lịch cố định.</p><p><b>Xe in-house</b>: xe của SPX, chi phí gần như cố định; <b>thuê theo chuyến (per trip)</b>: trả theo từng chuyến. Trang tính chuyến in-house bằng ${G.truck.ihF}% giá thuê theo chuyến (đổi trong Cấu hình). Nếu đặt dưới 100%, tiết kiệm từ bớt chuyến in-house chỉ thành tiền thật khi xe đó được dùng việc khác.</p><p>Số chuyến là chuyến quy đổi: một chuyến chở nhiều điểm được chia theo lượng hàng mỗi điểm lên xe.</p>`],
  real:["Ngày có chuyến thật",`<p>Tỷ lệ điểm·ngày có chuyến trong file Linehaul. Phần còn lại tiền xe ước theo mô hình.</p>`],
  cal:["Lấp đầy theo chuyến thật",`<p>Ngày số chuyến thật nhiều hơn hẳn số chuyến tối thiểu (số SOC × số mốc) là ngày xe phải chạy thêm vì đã đầy. Mức đầy những ngày đó (p90, cần ít nhất ${CAL_MIN} ngày) là sức chứa thật với hàng của điểm. Chỉ hạ, không nâng mức chung. Tắt được trong Cấu hình.</p>`],
  labor:["Mô hình người",`<p>Hub là bên bố trí người tại điểm: FTE của hub đóng tại điểm, BPO thuê theo ngày, hoặc một nhóm của Hub dùng chung cho nhiều điểm. Trang đang so "mỗi điểm người riêng" với "dùng chung người". Lương FTE và BPO đang bằng nhau nên chưa so được hai mô hình đó; nhập lương thật trong Cấu hình.</p>`],
  thr:["Ngưỡng ADO được tính thế nào",`<p>Mỗi vùng lấy một <b>điểm điển hình</b>: trung vị của các điểm đang chạy trong kỳ (đơn/ngày chạy, tỷ lệ hàng to, số SOC, số mốc COT). Với mỗi tổ hợp biến, trang dò ADO từ thấp lên và nhận mức đầu tiên mà từ đó tới gấp đôi đều lời. Lãi/lỗ tính đúng tại từng mức đơn, cùng công thức với tab Seller mới: nhập đúng ngưỡng vào Seller mới (cùng hồ sơ, cùng cách chạy) thì ngày đó ra lãi ≥ 0. Đòi hỏi "tới gấp đôi đều lời" để không bắt nhầm một mức lời tình cờ khi số xe hay số người vừa nhảy bậc.</p><ul class="why"><li><b>Ngưỡng thấp nhất</b>: tổ hợp tốt nhất trong các cách làm được ngay (xe riêng hoặc ghép xe, có/không 1 xe trả nhiều SOC, mỗi điểm người riêng hoặc dùng chung người). Dưới mức này thì cách chạy nào cũng lỗ.</li><li><b>Ngưỡng nếu chạy như hiện nay</b>: cách đi xe phổ biến nhất của vùng theo loại chuyến trong data linehaul (xe riêng, ghép xe hay ké xe); dùng chung người nếu phần lớn điểm của vùng thuộc FM Hub có từ ${G.lab.poolN} điểm D2S trở lên, còn lại người riêng.</li><li><b>Nếu ké được xe FLM</b>: cần xác nhận có xe FM/LM đi qua đúng giờ nên ghi riêng. Hub trả tiền xe (0đ) chỉ đúng với vài điểm, xem trong ma trận.</li><li><b>Cận trên</b>: xem lãi mỗi đơn khi ADO rất lớn (20.000 đơn/ngày). Còn dương thì mô hình không có cận trên.</li></ul><p>Tiền xe ở trang này tính theo mô hình (giá chuyến, sức chứa, lấp đầy ở Cấu hình), không dùng chuyến lịch sử. Ghép xe và dùng chung người giả định điểm đi cùng có cùng số đơn với điểm đang xét, để ngưỡng nói về từng seller chứ không phải seller nhỏ đi ké xe của seller lớn. Người của Hub qua điểm làm hết việc (quét, bàn giao, xếp xe, sort nếu có), tối thiểu 1 người mỗi ngày chạy hoặc chia trong nhóm đi vòng.</p>`],
  lich:["Lịch loại ngày",`<p>Mỗi ngày là BAU, Mini CP hoặc CP. Mặc định lấy từ sheet Config [Report]; bấm một ngày để đổi, đổi xong gốc và kịch bản cùng tính lại. Loại ngày quyết định điểm có chạy D2S hôm đó không và chia bao nhiêu chute (= số SOC hàng về).</p><p>Các điểm HCM có trong sheet Config D2S (M8-M9-M10/2026) dùng khung CP/Mini riêng của sheet. Thứ tự ưu tiên: chỉnh riêng ngày của điểm → sheet Config D2S → lịch này.</p>`],
  rec:["Bộ đề xuất",`<p>Mạng trước, từng điểm sau. (1) Kế hoạch mạng của từng vùng: tuyến xe và nhóm người tối ưu cho cả vùng (mục 0). (2) Điểm đang lỗ không nằm trong tuyến mạng nào: đổi cỡ xe hoặc 1 xe nhiều SOC nếu có lợi; số chute nếu có lợi. Các mục "cần xác nhận" không nằm trong bộ này.</p>`],
  net:["Tối ưu toàn mạng tính thế nào",`<ol class="why"><li><b>Mạng lưới.</b> Mỗi điểm D2S là một nút. Hai điểm <b>ghép được xe</b> khi chung ít nhất một SOC đích, chạy trùng ít nhất nửa số ngày và cách nhau không quá ${G.truck.gKm||"∞"} km; hoặc đang đi chung từ 3 chuyến thật trở lên. Hai điểm <b>dùng chung được người</b> chỉ khi cùng FM Hub (và cách nhau tối đa ${G.lab.tKm||"∞"} km): KPI tính theo hub nên hub nào lo điểm của hub đó.</li>
    <li><b>Điểm xuất phát</b> là mạng đang chạy: tuyến ghép theo chuyến thật, nhóm người theo FM Hub.</li>
    <li><b>Mỗi vòng</b> thử mọi nước: gộp hai tuyến (hoặc hai nhóm), chuyển một điểm sang tuyến khác, đổi chỗ hai điểm giữa hai tuyến, tách một điểm ra đi riêng. Làm nước giảm tổng chi phí của cả vùng nhiều nhất, lặp tới khi không còn nước nào lời quá 0,5 tr. Một tuyến tối đa ${G.truck.stops} điểm lấy hàng; một nhóm người tối đa ${G.lab.tMax} điểm.</li>
    <li><b>Chi phí xe</b> mỗi tuyến tính như bước 4: cộng hàng các điểm chạy ngày đó, chọn loại và số xe rẻ nhất, cộng phụ phí mỗi điểm lấy thêm, chia theo chỗ chiếm. Để so công bằng, bộ tìm so mọi tuyến trên cùng mô hình; số hiện trên trang = tiền xe thật hôm nay + phần mô hình thay đổi do đổi tuyến, nên không lẫn phần "đổi cỡ xe" (đã có dòng riêng). <b>Chi phí người</b>: cộng việc các điểm trong nhóm, cộng ${G.lab.ovh}% thời gian đi lại, làm tròn một lần.</li>
    <li><b>Gói</b> = các tuyến mới cùng các tuyến đang chạy bị cắt, nối với nhau qua điểm chung. Các gói độc lập với nhau nên cộng được.</li></ol>
    <p class="note">Chưa tính: giờ lấy hàng của từng điểm có khớp để một xe hoặc một nhóm người đi vòng kịp không (data linehaul có giờ, sẽ thêm), đường đi thực tế giữa các điểm (đang dùng đường chim bay × 1,3).</p>`]
};
MR.fix=m=>{const L=S.map((_,i)=>i).filter(i=>fixedR(i)&&inR(i));return {title:"Điểm đã sửa cho đúng thực tế",sub:"Phần này nằm trong gốc.",size:"md",body:`<div class="tablewrap"><table class="data"><thead><tr><th>Điểm</th><th style="text-align:left">Đã sửa</th></tr></thead><tbody>${L.map(i=>`<tr class="click" data-pt="${i}" data-tab="set"><td class="l rowname">${esc(S[i].n)}</td><td class="l"><span class="mini" style="white-space:normal">${esc(manualSummary(i,"r"))}</span></td></tr>`).join("")}</tbody></table></div><p class="note">Muốn chuyển một mục sang "thử thay đổi" thì xoá ở chế độ Sửa cho đúng thực tế rồi nhập lại ở chế độ Thử thay đổi.</p>`};};
MR.info=m=>{const x=INFO[m.key]||["",""];return {title:x[0],size:"sm",body:x[1]};};
MR.confirm=m=>({title:m.title||"Xác nhận",size:"sm",body:`<p style="margin:0 0 14px">${m.text}</p><div class="row" style="margin:0;justify-content:flex-end"><button type="button" class="ghost" data-close="${MS.indexOf(m)}">Huỷ</button><button type="button" class="pri" data-okc="${MS.indexOf(m)}">${m.ok||"Đồng ý"}</button></div>`});

/* =====================================================================
   NGƯỠNG ADO — "Mức ADO hợp lý để chạy D2S là bao nhiêu?"
   Một điểm điển hình mỗi vùng (trung vị data). Với mỗi tổ hợp biến, dò ADO hoà vốn
   = mức thấp nhất mà từ đó tới gấp đôi đều lời (lãi tính đúng tại từng mức đơn).
   Ngưỡng thấp nhất  = tổ hợp tốt nhất trong các cách làm được ngay (không cần xác nhận).
   Ngưỡng như hiện nay = cách đi xe phổ biến của vùng (theo loại chuyến), mô hình người phổ biến của vùng trong gốc.
   Cận trên: kiểm tra lãi mỗi đơn khi ADO rất lớn.
   ===================================================================== */
const pct=(a,p)=>{const b=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!b.length)return null;return b[Math.min(b.length-1,Math.max(0,Math.round(p*(b.length-1))))];};
const adoRun=i=>{const t=BASE.tot[i];return t.run?t.vol/t.run:0;};
function sumBk(i){let b=0;for(const d of ACT){const r=BASE.rows[i][d];if(r.vol>0)b+=r.bk;}return b;}
const TT2TM={T1:"rieng",T2:"ghep",T3:"ke",T4:"ke"};
function thrProfile(R){
  const idx=S.map((_,i)=>i).filter(i=>S[i].R===R&&BASE.tot[i].vol>0);
  if(!idx.length)return null;
  const bet=idx.map(i=>BASE.tot[i].vol?sumBk(i)/BASE.tot[i].vol:0);
  const tc={};idx.forEach(i=>{const t=TT2TM[S[i].tt];if(t)tc[t]=(tc[t]||0)+1;});
  const tmNow=(Object.entries(tc).sort((a,b)=>b[1]-a[1])[0]||["rieng"])[0];
  const nPool=idx.filter(i=>RES.set[i].team).length;
  return {R,idx,n:idx.length,nPool,lkNow:nPool*2>idx.length?"3c":"1",beta:Math.round((pct(bet,.5)||0)*100)/100,b25:pct(bet,.25),b75:pct(bet,.75),sb:RG[R].sb?1:0,
    ns:Math.max(1,Math.round(pct(idx.map(i=>RES.set[i].ns),.5)||1)),ch:Math.max(1,Math.round(pct(idx.map(i=>RES.set[i].ch0||1),.5)||1)),
    req:Math.max(1,Math.round(pct(idx.map(i=>reqOf(RES.set[i],RES.set[i].ch0||1)),.5)||1)),F:(()=>{const c={};idx.forEach(i=>c[S[i].F]=(c[S[i].F]||0)+1);return (Object.entries(c).sort((a,b)=>b[1]-a[1])[0]||[FLOWDEF[R]])[0];})(),mt:Math.max(1,Math.round(pct(idx.map(i=>RES.set[i].mt),.5)||1)),
    ado:pct(idx.map(adoRun),.5),tmNow,tc};}

/* ---- các biến ---- */
const pc=v=>Math.round(v*100)+"%";
const THV={
  beta:{n:"Tỷ lệ hàng to",lv:[0,.25,.5,.75,1],f:pc},
  ns:{n:"Số SOC xe chở tới",lv:[1,2,3,4],f:v=>v+" SOC"},
  ch:{n:"Số chute seller chia",lv:[1,2,3,4],f:v=>v+" chute"},
  mt:{n:"Số mốc COT/ngày",lv:[1,2,3],f:v=>v+" mốc"},
  fl:{n:"Lấp đầy xe tối đa",lv:[60,70,85,100],f:v=>v+"%"},
  pay:{n:"Lương người Hub tại điểm/ngày",lv:[350000,450000,520000],f:v=>f0(v/1e3)+"k"},
  sv:{n:"Tiết kiệm FM mỗi đơn (so với giả định)",lv:[50,75,100],f:v=>v+"%"}};
const TRK=[
  {k:"rieng",n:"Xe riêng",sub:"mỗi SOC một chuyến",o:{tm:"rieng",md:0}},
  {k:"md",n:"Xe riêng, 1 xe ghé nhiều SOC",o:{tm:"rieng",md:1},multi:1},
  {k:"ghep",n:"Ghép xe trong nhóm",sub:"cả nhóm đi chung xe",o:{tm:"ghep",md:0}},
  {k:"ghepmd",n:"Ghép xe trong nhóm, ghé nhiều SOC",o:{tm:"ghep",md:1},multi:1},
  {k:"ke",n:"Ké xe FM/LM có sẵn",o:{tm:"ke",md:0},cond:1},
  {k:"hub",n:"Hub trả tiền xe (0đ)",o:{tm:"rieng",md:0,hub:1},cond:1}];
/* cột: nhóm N điểm giống nhau (cùng FM Hub) × người riêng / dùng chung */
const LABM=[
  {k:"1",N:1,ch:0,n:"1 điểm",sub:"đi một mình"},
  {k:"2r",N:2,ch:0,n:"Nhóm 2 điểm",sub:"mỗi điểm người riêng"},
  {k:"2c",N:2,ch:1,n:"Nhóm 2 điểm",sub:"dùng chung người"},
  {k:"3r",N:3,ch:0,n:"Nhóm 3 điểm",sub:"mỗi điểm người riêng"},
  {k:"3c",N:3,ch:1,n:"Nhóm 3 điểm",sub:"dùng chung người"}];
LABM.forEach(l=>l.o={pooled:!!l.ch&&l.N>1,nT:l.ch?l.N-1:0});
const labName=l=>l.N===1?"1 điểm đi một mình":`nhóm ${l.N} điểm, ${l.sub}`;
/* ô hợp lệ: ghép xe cần nhóm ≥ 2 điểm; "ghé nhiều SOC" cần ≥ 2 SOC */
const validC=(tk,lk,ns)=>!(trkOf(tk).multi&&ns<=1)&&!(trkOf(tk).o.tm==="ghep"&&labOf(lk).N<2);
const TMNOW={rieng:"rieng",ghep:"ghep",ke:"ke"};
const trkOf=k=>TRK.find(x=>x.k===k),labOf=k=>LABM.find(x=>x.k===k);
const thrDef=P=>({beta:P.beta,ns:P.ns,ch:P.ch,req:P.req,mt:P.mt,fl:G.truck.fill,pay:G.lab.payB,sv:100});
const thrVars=P=>Object.assign(thrDef(P),(ui.thrV&&ui.thrV[P.R])||{});
const comboO=(tk,lk)=>{const t=trkOf(tk),l=labOf(lk);return Object.assign({},t.o,l.o,{nG:t.o.tm==="ghep"?l.N-1:0});};
const thrO=(P,vars,tk,lk)=>Object.assign({tm:"rieng",md:0,pooled:false,nG:1,nT:0,adoG:null,hub:0},vars,comboO(tk,lk));   // adoG null = điểm đi cùng có cùng số đơn
const nowTk=P=>TMNOW[P.tmNow]||"rieng";
const lc=x=>x?x.charAt(0).toLowerCase()+x.slice(1):x;   // viết thường chữ đầu, giữ FM/LM, SOC
const cbName=(tk,lk)=>`${trkOf(tk).n} · ${labName(labOf(lk))}`;
/* cách chạy phổ biến hiện nay của vùng: ghép xe → nhóm ≥ 2; phần lớn điểm dùng chung người trong Hub → nhóm 3 dùng chung */
const nowLk=(P,tk)=>P.lkNow==="3c"?"3c":tk==="ghep"?"2r":"1";

function thrSetup(P,o,X){o=o.adoG==null?Object.assign({},o,{adoG:X}):o;
  const p=Object.assign({},RG[P.R]||RBASE,o.sp!=null?{sp:o.sp}:{},o.ho!=null?{ho:o.ho}:{},{beta:o.beta,ns:o.ns,ch0:Math.max(o.ns,o.ch||o.ns),req:Math.max(o.ns,o.req||o.ch||o.ns),mt:o.mt,mt0:P.mt0??P.mt,veh:o.veh||"auto",md:o.md?1:0,tm:o.tm,fl:o.fl,pay:o.hub?"hub":"d2s"});
  const wOf=x=>{const bk=x*o.beta;return workOf(p,x-bk,bk,p.ch0,p.ns).w;};
  const team=o.pooled&&o.nT>0?{W:wOf(o.adoG)*o.nT,n:o.nT}:null;
  p.st=p.ns;
  const truck=o.tm==="ghep"&&o.nG>0?{nb:o.adoG*(1-o.beta)*o.nG,b:o.adoG*o.beta*o.nG,n:o.nG,k:o.ns,md:!!o.md,fl:flx(o.fl)}:null;
  return {p,team,truck};}
function inCtx(o,fn){const L=G.lab,k=[L.payB,L.payF,G.save];
  if(o.pay!=null){L.payB=o.pay;L.payF=o.pay;}
  if(o.sv!=null&&o.sv!==100)G.save=Object.assign({},k[2],{rS:k[2].rS*o.sv/100,hS:k[2].hS*o.sv/100});
  try{return fn();}finally{L.payB=k[0];L.payF=k[1];G.save=k[2];}}
let thrMemo={};
function thrAt(P,o){const key=JSON.stringify([P.R,P.ado,o,G.lab,G.truck,G.veh,G.save,G.prod,G.soc,socAlways,RG[P.R]]);if(key in thrMemo)return thrMemo[key];
  return thrMemo[key]=inCtx(o,()=>exactMin(x=>{const q=thrSetup(P,o,x),e=evalAt(x,q.p,q.team,q.truck);return e.save-e.cost;}));}
const MULT=[1];   // lãi/lỗ đúng tại mức đơn đó (không làm mượt) — để Seller mới nhập đúng ngưỡng thì ra lãi ≥ 0
/* lãi/lỗ mỗi đơn ở mức X (làm mượt như cách dò ngưỡng) + tách từng khoản */
function thrProf(P,o,X){const {p}=thrSetup(P,o,X);
  return inCtx(o,()=>{let c=0,s=0,l=0,t=0,so=0,v=0;for(const m of MULT){const q=thrSetup(P,o,X*m),e=evalAt(X*m,q.p,q.team,q.truck);c+=e.cost;s+=e.save;l+=e.lab;t+=e.tk;so+=e.soc;v+=X*m;}
    const bk=X*o.beta,w=workOf(p,X-bk,bk,p.ch0,p.ns).w;
    return {per:(s-c)/v,save:s/v,lab:l/v,tk:t/v,soc:so/v,w};});}
const fxT=v=>v==null?"không đạt":v<=GRID[0]?"≤ "+f0(GRID[0]):f0(v);
/* ngưỡng thấp nhất (làm được ngay), như hiện nay, có điều kiện */
function thrBand(P,vars){vars=vars||thrDef(P);
  const all=[];TRK.forEach(t=>LABM.forEach(l=>{if(!validC(t.k,l.k,vars.ns))return;all.push({tk:t.k,lk:l.k,cond:!!t.cond,v:thrAt(P,thrO(P,vars,t.k,l.k))});}));
  const pick=a=>a.filter(x=>x.v!=null).sort((x,y)=>x.v-y.v)[0]||null;
  const now={tk:nowTk(P),lk:nowLk(P,nowTk(P))};now.v=thrAt(P,thrO(P,vars,now.tk,now.lk));
  return {all,best:pick(all.filter(x=>!x.cond)),cond:pick(all.filter(x=>x.tk==="ke")),now};}
/* ADO thấp nhất có thể chạy: ngoài cách đi xe và bố trí người, thử cả GIẢM số chute (xe tới ít SOC hơn, SOC đầu sort lại phần thiếu)
   và GIẢM số mốc COT (ít chặng xe hơn). Chỉ giảm, không tăng so với điểm điển hình. */
let thrOptMemo={};
function thrOpt(P,mid){const key=JSON.stringify([!!mid,P.R,P.F,P.ado,P.ch,P.ns,P.mt,P.req,G.lab,G.truck,G.veh,G.save,G.prod,G.soc,socAlways,RG[P.R]]);if(key in thrOptMemo)return thrOptMemo[key];
  let best=null;
  const cur=Math.max(1,P.ch,P.ns),req=Math.max(P.req||0,P.ch,P.ns),gRs=G.soc.gRs!=null?G.soc.gRs:25,curRs=(req-cur)/req*100;
  const stM=Math.max(P.ns,((FLOW[P.F]||{}).st)||P.ns);   // xe tới được tối đa bao nhiêu SOC theo luồng của vùng
  // thử từ số chute hiện nay trước (hoà thì giữ cách ít thay đổi nhất), rồi lần lượt bớt / thêm tới luồng chuẩn
  const chs=[];for(let c=1;c<=Math.max(cur,req);c++)chs.push(c);chs.sort((a,b)=>Math.abs(a-cur)-Math.abs(b-cur)||b-a);
  for(const ch of chs)for(let mt=P.mt;mt>=1;mt--){const ns=Math.max(1,Math.min(ch,ch>=cur?Math.max(P.ns,Math.min(stM,ch-cur+P.ns)):P.ns,stM));
    const vars=Object.assign(thrDef(P),{ch,ns,mt,req});
    // điểm giữa: giới hạn vận hành — SOC chia lại không quá mức cho phép hoặc mức đang chạy hiện nay (đã tính tiền sort thêm tại SOC), không bớt SOC xe tới
    if(mid){if(G.soc.gKeep!==false&&ns<P.ns)continue;if((req-ch)/req*100>Math.max(gRs,curRs)+1e-9)continue;}
    TRK.forEach(t=>{if(t.cond)return;LABM.forEach(l=>{if(!validC(t.k,l.k,ns))return;const v=thrAt(P,thrO(P,vars,t.k,l.k));
      if(v==null)return;if(mid&&mt<P.mt&&G.truck.gCot!==false&&v/mt>P.ado/P.mt)return;   // mỗi lượt xe không lấy nhiều hơn một lượt hiện nay
      if(!best||v<best.v)best={v,tk:t.k,lk:l.k,ch,mt,ns,vars};});});}
  return thrOptMemo[key]=best;}
/* những gì khác điểm điển hình để đạt ADO thấp nhất */
const optChg=(P,b)=>{const a=[],cur=Math.max(P.ch,P.ns);if(b&&b.ch!==cur)a.push(`chia ${b.ch} chute thay vì ${cur}`);if(b&&b.ns!==P.ns)a.push(`xe tới ${b.ns} SOC thay vì ${P.ns}`);if(b&&b.mt<P.mt)a.push(`${b.mt} mốc COT thay vì ${P.mt}`);return a;};
const optName=(P,b)=>b?cbName(b.tk,b.lk)+(optChg(P,b).length?" · "+optChg(P,b).join(" · "):""):"";
function zoneOf(P,B,i){const a=adoRun(i),X=B.best?B.best.v:null,Y=B.now.v;if(X==null||a<X)return "low";if(Y==null||a<Y)return "mid";return "high";}
const ZN={low:"Dưới điểm giữa",mid:"Giữa hai ngưỡng",high:"Từ ngưỡng như hiện nay trở lên"};
const regPick=()=>`<div class="seg" role="group" aria-label="Vùng">${REG.filter(R=>thrProfile(R)).map(R=>`<button type="button" data-thrr="${R}" aria-pressed="${R===ui.thrR}">${R}</button>`).join("")}</div>`;
function thrRegs(){const rows=REG.map(R=>{const P=thrProfile(R);if(!P)return null;const B=thrBand(P);B.best0=B.best;B.max=thrOpt(P,false);B.mid=thrOpt(P,true);if(B.mid&&(!B.best||B.mid.v<=B.best.v))B.best=B.mid;const z={low:[],mid:[],high:[]};P.idx.forEach(i=>z[zoneOf(P,B,i)].push(i));return {R,P,B,z};}).filter(Boolean);
  if(!ui.thrR||!rows.some(r=>r.R===ui.thrR))ui.thrR=(rows.slice().sort((a,b)=>b.P.n-a.P.n)[0]||{}).R;return rows;}
const profTxt=P=>`${P.n} điểm · ${f0(P.ado)} đơn/ngày chạy · ${pc(P.beta)} hàng to · chia ${P.ch} chute, xe tới ${P.ns} SOC (${lc(sortTxt(P.ch,P.ns))}) · ${P.mt} mốc COT · phổ biến: ${lc(trkOf(nowTk(P)).n)}, ${P.nPool}/${P.n} điểm dùng chung người trong Hub`;

/* ================= TRANG NGƯỠNG ADO ================= */
function renderThr(){
  const el=$("thrMain");if(!el||!BASE)return;
  ui.thrV=ui.thrV||{};ui.thrC=ui.thrC||{};ui.thrD=ui.thrD||"trk";ui.dOpen=ui.dOpen||{};
  const rows=thrRegs().filter(r=>ui.reg==="all"||r.R===ui.reg);
  if(rows.length&&!rows.some(r=>r.R===ui.thrR))ui.thrR=rows[0].R;
  const W=thrWhyData(rows),cur=rows.find(r=>r.R===ui.thrR),w=W.find(x=>x.R===ui.thrR);
  el.innerHTML=thrSummary(rows,W)+(cur&&w?thrRegion(cur,w,W):"");}

/* ---- dữ liệu cho mỗi vùng tại ADO thấp nhất (điểm giữa): tiết kiệm một ngày ≥ chi phí một ngày ---- */
function thrWhyData(rows){return rows.filter(r=>r.B.best&&r.B.best.v!=null).map(r=>{const {P,B}=r,b=B.best,V0=b.vars||thrDef(P),o=thrO(P,V0,b.tk,b.lk),X=b.v,PP=Object.assign({},P,{ns:V0.ns,mt:V0.mt,ch:V0.ch,mt0:P.mt0??P.mt});
    const e=inCtx(o,()=>{const q=thrSetup(P,o,X);return evalAt(X,q.p,q.team,q.truck);}),I=e.info||{};
    const ch=Math.max(PP.ns,PP.ch),md=o.md&&PP.ns>1,legs=(md?1:PP.ns)*PP.mt,s=e.save/X,C=e.tk+e.lab+e.soc,n=Math.max(I.tkN||1,I.hcN||1);
    const req=Math.max(P.req||0,P.ch,P.ns),rsN=e.soc>1?X*(req-ch)/req:0;
    return {R:r.R,r,P:PP,P0:P,o,b,X,e,I,ch,md,legs,s,C,n,rsN,chg:optChg(P,b),low:r.z.low.length};});}
const kK=v=>f0(v/1e3)+"k";
/* điều kiện chính gói trong một dòng */
function thrShort(w){const a=[w.n>1?`nhóm ${w.n} điểm cùng Hub`:"1 điểm"];
  a.push(w.o.tm==="ke"?"ké xe FM/LM":w.o.tm==="ghep"?(w.md?"ghép xe, ghé nhiều SOC":"ghép xe"):(w.md?"1 xe ghé nhiều SOC":"xe riêng"));
  if(w.I.hcN>1)a.push("chung người");
  if(w.ch!==Math.max(w.P0.ch,w.P0.ns))a.push(`${w.ch} chute (từ ${Math.max(w.P0.ch,w.P0.ns)})`);
  if(w.P.mt<w.P0.mt)a.push(`${w.P.mt} mốc COT (từ ${w.P0.mt})`);
  return a.join(" · ");}
function thrVs(w,W){const m=W.slice().sort((a,b)=>a.X-b.X)[0];
  if(w===m)return `Thấp nhất: ${w.legs} chặng xe mỗi ngày${w.I.tkN>1?`, tiền xe chia cho ${w.I.tkN} điểm`:""}, ${pc(w.P.beta)} hàng to nên mỗi đơn tiết kiệm nhiều.`;
  const rc=w.C/m.C,rs=w.s/m.s,dT=w.e.tk-m.e.tk,dL=w.e.lab+w.e.soc-m.e.lab-m.e.soc,out=[];
  if(rc>=1.15)out.push(`chi phí một ngày gấp ${f1(rc)} lần, ${dT>=dL?`chủ yếu tiền xe (${w.legs} chặng/ngày, ${m.R} chỉ ${m.legs})`:`chủ yếu tiền người (${w.I.hcT} người${w.I.hcN>1?` cho ${w.I.hcN} điểm`:""}, ${lc(sortTxt(w.ch,w.P.ns))})`}`);
  else if(rc<=0.87)out.push(`chi phí một ngày chỉ bằng ${Math.round(rc*100)}%`);else out.push("chi phí một ngày tương đương");
  if(rs<=0.95)out.push(`mỗi đơn tiết kiệm chỉ bằng ${Math.round(rs*100)}% vì ít hàng to hơn`);else if(rs>=1.05)out.push(`mỗi đơn tiết kiệm nhiều hơn ${Math.round((rs-1)*100)}%`);
  return `So với ${m.R}: ${out.join("; ")} → cần gấp ${f1(w.X/m.X)} lần số đơn.`;}

/* ---- 1. Tóm tắt: một con số mỗi vùng ---- */

  return `<section class="thsum">

    <div class="tablewrap"><table class="thtab"><thead><tr><th>Vùng</th><th class="r">ADO thấp nhất</th><th>Cần chạy thế nào</th><th class="r" title="ADO thấp nhất nếu giữ nguyên số chute, số SOC xe tới, số mốc COT như hiện nay">Nếu không đổi<br>chute · SOC · COT</th><th class="r" title="ADO thấp nhất nếu được bớt chute, SOC, mốc COT không giới hạn (chưa đảm bảo vận hành)">Nếu đổi<br>tối đa</th><th class="r">Điểm đang dưới mức</th></tr></thead><tbody>

      <td class="r"><button type="button" class="linkn" data-zone="${w.R}:low">${w.low}</button><span class="thdim"> / ${w.P0.n}</span></td></tr>`;}).join("")}</tbody></table></div>
    <details class="thmore" data-keep="thLv"${ui.dOpen.thLv?" open":""}><summary>Con số này nghĩa là gì</summary>
      <p>Mức đơn thấp nhất mà từ đó tới gấp đôi mức đó, điểm luôn có lời. Trang thử mọi cách ghép xe và bố trí người, rồi cho bớt chute và mốc COT trong ba giới hạn vận hành: SOC sort lại tối đa ${gRs}% đơn của điểm${G.soc.gKeep!==false?"; xe vẫn tới đủ số SOC như hiện nay":""}${G.truck.gCot!==false?"; chỉ bớt mốc COT khi mỗi lượt xe không phải lấy nhiều đơn hơn một lượt hiện nay":""}. <button type="button" class="linkn" data-open="cfg">Sửa giới hạn</button></p>
      <p><b>Giữ nguyên</b> là khi không đổi chute, SOC, mốc COT. <b>Tối đa</b> là khi bớt không giới hạn, thường phải dồn hàng về 1 SOC để SOC sort lại, chưa đảm bảo vận hành.</p></details>

/* ---- 2. Một vùng: phép tính, điều kiện, rồi các lớp chi tiết ---- */
function thrRegion(C,w,W){const {R,P}=C;
  const kv=[
    ["Nhóm điểm",w.n>1?`${w.n} điểm cùng FM Hub, mỗi điểm ≥ ${f0(w.X)} đơn mỗi ngày chạy`:`1 điểm đi một mình, ≥ ${f0(w.X)} đơn mỗi ngày chạy`],
    ["Xe",w.o.tm==="ke"?"ké xe FM/LM có sẵn":`${w.I.tkN>1?`ghép chung ${esc(w.I.veh)} cho ${w.I.tkN} điểm`:esc(w.I.veh)}, tới ${w.P.ns} SOC${w.md?" bằng 1 xe ghé lần lượt":""}, ${w.P.mt} mốc COT → ${w.legs} chặng/ngày`],
    ["Người của Hub",w.I.hcN>1?`${w.I.hcT} người dùng chung cho ${w.I.hcN} điểm`:`${w.I.hcT} người cho điểm`],
    ["Tại seller",`chia ${w.ch} chute, ${lc(sortTxt(w.ch,w.P.ns))}`],
    ["SOC sort thêm",w.rsN>0?`${f0(w.rsN)} đơn/ngày, tiền sort thêm ${kK(w.e.soc)}/ngày (đã tính vào chi phí)`:"không"]];
  const flags=[];
  if(w.P.mt<w.P0.mt)flags.push(`Bớt mốc COT từ ${w.P0.mt} xuống ${w.P.mt}: cần khớp giờ đóng gói của seller và cut-off SOC`);
  {const cur=Math.max(w.P0.ch,w.P0.ns),req=Math.max(w.P0.req||0,w.P0.ch,w.P0.ns);
   if(w.ch>cur)flags.push(`Chia ${w.ch} chute thay vì ${cur}${w.P.ns>w.P0.ns?`, xe tới ${w.P.ns} SOC thay vì ${w.P0.ns}`:""}: seller cần thêm chỗ và thêm người sort`);
   if(w.rsN>0)flags.push(`Chia ${w.ch}/${req} chute so với luồng chuẩn: SOC đầu sort thêm ${f0(w.rsN)} đơn/ngày${w.ch<cur?"":" như hiện nay"}; đã cộng tiền sort thêm tại SOC ${kK(w.e.soc)}/ngày vào chi phí${w.ch<cur?", cần SOC xác nhận nhận thêm khối việc này":""}`);}
  if(w.n>1)flags.push(`Cần ${w.n} điểm cùng FM Hub chạy cùng lúc; một điểm đi một mình ở ${f0(w.X)} đơn sẽ lỗ`);
  const dd=(key,title,tag,body)=>`<details class="dd thd" data-keep="${key}"${ui.dOpen[key]?" open":""}><summary>${title}${tag?`<span class="tag">${tag}</span>`:""}</summary><div class="ddbody">${body}</div></details>`;
  const cost=`<dl class="thkv">
      <dt>Xe</dt><dd>${kK(w.e.tk)}${w.I.tkN>1?` <span class="thdim">(phần của điểm trong ${esc(w.I.veh)} chở chung ${w.I.tkN} điểm)</span>`:""}</dd>
      <dt>Người</dt><dd>${kK(w.e.lab)}${w.I.hcN>1?` <span class="thdim">(phần của điểm trong ${w.I.hcT} người dùng chung)</span>`:""}</dd>
      ${w.e.soc>1?`<dt>SOC sort lại</dt><dd>${kK(w.e.soc)}</dd>`:""}
      <dt>Chi phí một ngày</dt><dd><b>${kK(w.C)}</b></dd>
      <dt>Tiết kiệm một ngày</dt><dd>${f0(w.X)} đơn × ${f0(w.s)}đ = <b>${kK(w.e.save)}</b> → lời ${kK(w.e.save-w.C)}</dd></dl>
    <p class="note">Tiết kiệm mỗi đơn cao khi nhiều hàng to (${pc(w.P.beta)} ở ${R}), vì hàng to tốn rider và FM Hub hơn. Lương ${f0(G.lab.payB/1e3)}k/người/ngày, xe chở đầy tối đa ${G.truck.fill}%.</p>`;
  const cmp=`<div class="tablewrap"><table class="thtab"><thead><tr><th>Vùng</th><th class="r">ADO thấp nhất</th><th class="r">Chi phí một ngày</th><th class="r">Tiết kiệm mỗi đơn</th><th>Vì sao</th></tr></thead><tbody>

  return `<section class="threg">

    <p class="thcalc">${kK(w.C)} chi phí một ngày ÷ ${f0(w.s)}đ tiết kiệm mỗi đơn ≈ ${f0(w.C/w.s)} đơn <span class="thdim">(làm tròn theo bậc xe và người ra ${fxT(w.X)})</span></p>

  </section>`;}

/* ---- Cận trên có thật không ---- */
function thrUpper(C){const {R,P,B}=C,o=thrO(P,thrDef(P),B.now.tk,B.now.lk);
  const XS=[Math.round(P.ado),1000,5000,20000].filter((x,k,a)=>a.indexOf(x)===k).sort((a,b)=>a-b);
  const pr=XS.map(X=>Object.assign({X},thrProf(P,o,X)));const top=pr[pr.length-1],cost=top.tk+top.lab+top.soc;
  const cut=top.save>0?Math.round((1-cost/top.save)*100):0,hc=Math.ceil(top.w-1e-9);
  return `<div class="card"><h3>${R}: có mức ADO nào cao quá mà không chạy được không?</h3>
    <div class="tablewrap"><table class="data"><thead><tr><th>Đơn/ngày</th><th>Tiết kiệm/đơn</th><th>Tiền xe/đơn</th><th>Tiền người/đơn</th><th>Lãi/lỗ mỗi đơn</th></tr></thead><tbody>
    ${pr.map(x=>`<tr><td class="num">${f0(x.X)}${x.X===Math.round(P.ado)?'<span class="mini">điển hình</span>':""}</td><td class="num">${f0(x.save)}đ</td><td class="num">${f0(x.tk)}đ</td><td class="num">${f0(x.lab)}đ</td><td class="num ${cls(x.per)}"><b>${x.per>0?"+":""}${f0(x.per)}đ</b></td></tr>`).join("")}</tbody></table></div>

/* ---- Thử mọi tổ hợp: ma trận + các đường ---- */
function thrExplore(C){const {R,P}=C,V=thrVars(P),B=thrBand(P,V);

  if(trkOf(selC[0]).multi&&V.ns<=1)selC[0]=selC[0]==="md"?"rieng":"ghep";
  if(!validC(selC[0],selC[1],V.ns))selC[1]="2r";
  const selOpt=(k,v)=>{const lv=THV[k].lv.slice();const d=thrDef(P)[k];if(!lv.includes(d))lv.push(d);lv.sort((a,b)=>a-b);
    return `<label class="thv"><span>${THV[k].n}</span><select class="inp sm" data-thv="${k}">${lv.map(x=>`<option value="${x}"${x===v?" selected":""}>${THV[k].f(x)}${x===d?" · điển hình":""}${k==="ch"&&x<V.ns?` (tính như ${V.ns}, vì xe tới ${V.ns} SOC)`:""}</option>`).join("")}</select></label>`;};
  const changed=Object.keys(ui.thrV[R]||{}).length;
  const cell=(t,l)=>{if(t.multi&&V.ns<=1)return `<td class="num"><span class="mini">1 SOC: như dòng trên</span></td>`;
    if(!validC(t.k,l.k,V.ns))return `<td class="num"><span class="mini">—</span></td>`;
    const v=thrAt(P,thrO(P,V,t.k,l.k)),id=t.k+"|"+l.k,best=B.best&&B.best.tk===t.k&&B.best.lk===l.k,sel=selC[0]===t.k&&selC[1]===l.k;
    return `<td class="num click thc${best?" best":""}${sel?" csel":""}${v!=null&&v<=P.ado?" okc":""}" data-thc="${id}" title="${esc(cbName(t.k,l.k))}: hoà vốn ${fxT(v)} đơn/ngày">${fxT(v)}</td>`;};
  return `<div class="card"><h3>${R}: thử mọi tổ hợp</h3>
    <p class="note" style="margin-top:0">Các biến bên dưới bắt đầu từ điểm điển hình của ${R}. Đổi một biến thì ma trận và các đường tính lại ngay.${changed?` <button type="button" class="ghost sm" data-thvreset="1">Về điểm điển hình</button>`:""}</p>
    <div class="thvs">${["ch","beta","mt","fl","pay","sv"].map(k=>selOpt(k,V[k])).join("")}</div>
    <div class="tabs" role="tablist" aria-label="Số SOC xe chở tới">${THV.ns.lv.map(n=>`<button type="button" role="tab" data-thns="${n}" aria-selected="${n===V.ns}">${n} SOC${n===P.ns?' <span class="n">điển hình</span>':""}</button>`).join("")}</div>
    <p class="tabsub">Mỗi thẻ là số SOC xe chở tới. Đang tính với <b>${Math.max(V.ns,V.ch||V.ns)} chute</b> (ô "Số chute seller chia"; điển hình ${R} ${P.ch} chute${(V.ch||V.ns)<V.ns?`; ô đang chọn ${V.ch} chute ít hơn số SOC nên tính bằng ${V.ns}`:""}) → ${lc(sortTxt(Math.max(V.ns,V.ch||V.ns),V.ns))}${Math.max(V.ns,V.ch||V.ns)<Math.max(V.ns,V.req||0)?`; chia ít hơn luồng chuẩn ${V.req} chute nên SOC đầu sort lại phần thiếu`:""}. Mỗi ô là ADO hoà vốn (đơn/ngày chạy, mỗi điểm) khi đi một mình hoặc trong một nhóm 2–3 điểm giống nhau cùng FM Hub. Trong nhóm, "ghép xe" là cả nhóm đi chung xe; "dùng chung người" là một nhóm người của Hub đi qua lại các điểm. Ô "—" là không áp dụng (đi một mình thì không có ai để ghép).</p>
    <div class="tablewrap"><table class="data matrix"><thead><tr><th>Cách đi xe</th>${LABM.map(l=>`<th>${l.n}<br><span style="font-weight:400">${l.sub}</span></th>`).join("")}</tr></thead><tbody>
      ${TRK.filter(t=>!(t.multi&&V.ns<=1)).map(t=>`<tr><td class="l">${t.n}${t.sub?`<span class="mini">${t.sub}</span>`:""}${t.cond?'<span class="cond">cần xác nhận</span>':""}</td>${LABM.map(l=>cell(t,l)).join("")}</tr>`).join("")}</tbody></table></div>

    <p class="note">Thấp nhất: <b>${fxT(B.best&&B.best.v)}</b> đơn/ngày (${B.best?esc(lc(cbName(B.best.tk,B.best.lk))):"–"}). Như hiện nay: <b>${fxT(B.now.v)}</b>. Các điểm trong nhóm giả định giống hệt điểm đang xét (cùng số đơn, cùng hồ sơ, cùng FM Hub); dùng chung người mất thêm ${G.lab.ovh}% thời gian đi lại. Muốn các điểm trong nhóm khác nhau, dựng nhóm ở tab Seller mới. Bấm một ô để vẽ đường cho tổ hợp đó.</p>

  ${thrLines(C,V,selC)}
  <details class="dd" id="thrScanBox"><summary>Quét toàn bộ tổ hợp biến<span class="tag">mọi mức của mọi biến</span></summary><div class="ddbody" id="thrScan">${scanHtml(P,V)}</div></details>`;}

/* ---- Các đường lãi/lỗ theo ADO ---- */
const THD=[["trk","Cách đi xe"],["lab","Nhóm & người"],["ns","Số SOC"],["ch","Số chute"],["mt","Số mốc COT"],["beta","% hàng to"],["fl","Lấp đầy xe"],["pay","Lương"],["sv","Tiết kiệm/đơn"]];
function thrSeries(P,V,selC,dim){

  if(dim==="trk")return TRK.filter(t=>validC(t.k,selC[1],V.ns)).map(t=>({n:t.n,o:base(t.k,selC[1]),on:t.k===selC[0]}));
  if(dim==="lab")return LABM.filter(l=>validC(selC[0],l.k,V.ns)).map(l=>({n:labName(l),o:base(selC[0],l.k),on:l.k===selC[1]}));
  // số chute ít hơn số SOC thì tính bằng số SOC → bỏ các mức đó cho khỏi trùng đường
  return THV[dim].lv.filter(v=>dim!=="ch"||v>=V.ns).map(v=>({n:THV[dim].f(v),o:base(selC[0],selC[1],{[dim]:v}),on:v===Math.max(V.ns,V[dim]||0)||(dim!=="ch"&&v===V[dim])}));}
function thrLines(C,V,selC){const {R,P}=C,dim=ui.thrD;
  const ser=thrSeries(P,V,selC,dim);
  const XS=[];for(let k=0;k<64;k++)XS.push(Math.round(30*Math.pow(20000/30,k/63)));
  ser.forEach((s,k)=>{s.c=`var(--s${k+1})`;s.y=XS.map(X=>thrProf(P,s.o,X).per);s.be=thrAt(P,s.o);s.beY=s.be!=null?thrProf(P,s.o,s.be).per:null;});
  const W=960,H=440,ml=78,mr=24,mt=18,mb=58,lx=v=>Math.log10(v),x0=lx(30),x1=lx(20000),px=v=>ml+(lx(Math.max(30,Math.min(20000,v)))-x0)/(x1-x0)*(W-ml-mr);
  const hi=Math.max(500,...ser.flatMap(s=>s.y)),yMax=Math.ceil(hi/250)*250,yMin=-Math.max(1000,Math.min(3000,Math.ceil(2*yMax/500)*500)),yStep=yMax-yMin<=2000?250:500,py=v=>mt+(yMax-Math.max(yMin,Math.min(yMax,v)))/(yMax-yMin)*(H-mt-mb);
  const tY=[];for(let v=yMin;v<=yMax;v+=yStep)tY.push(v);
  const tX=[30,100,300,1000,3000,10000,20000];
  const lowest=ser.filter(s=>s.be!=null).sort((a,b)=>a.be-b.be)[0];
  const path=s=>s.y.map((v,k)=>`${k?"L":"M"}${px(XS[k]).toFixed(1)},${py(v).toFixed(1)}`).join("");
  const svg=`<svg viewBox="0 0 ${W} ${H}" class="scat" role="img" aria-label="Lãi lỗ mỗi đơn theo ADO, mỗi đường một lựa chọn">
    <rect x="${ml}" y="${py(0)}" width="${W-ml-mr}" height="${H-mb-py(0)}" style="fill:var(--loss-fill)"/>
    ${tY.map(v=>`<line x1="${ml}" x2="${W-mr}" y1="${py(v)}" y2="${py(v)}" style="stroke:${v===0?"var(--ink)":"var(--line-2)"};stroke-width:${v===0?1.5:1}"/><text x="${ml-8}" y="${py(v)+4}" text-anchor="end" class="ch-s">${v>0?"+":""}${f0(v)}</text>`).join("")}
    <text x="${W-mr-6}" y="${py(0)-8}" text-anchor="end" class="ch-s" style="font-weight:600">hoà vốn</text>
    <text x="${W-mr-6}" y="${py(0)+18}" text-anchor="end" class="ch-s">vùng lỗ</text>
    ${tX.map(v=>`<line x1="${px(v)}" x2="${px(v)}" y1="${H-mb}" y2="${H-mb+5}" style="stroke:var(--line)"/><text x="${px(v)}" y="${H-mb+20}" text-anchor="middle" class="ch-s">${f0(v)}</text>`).join("")}
    <line x1="${px(P.ado)}" x2="${px(P.ado)}" y1="${mt}" y2="${H-mb}" style="stroke:var(--muted);stroke-dasharray:3 4"/><text x="${px(P.ado)+5}" y="${mt+12}" class="ch-s">điển hình ${f0(P.ado)}</text>
    <text x="${(ml+W-mr)/2}" y="${H-10}" text-anchor="middle" class="ch-t">Đơn mỗi ngày chạy D2S (thang nhân: mỗi vạch lớn gấp ~3 lần) →</text>
    <text x="16" y="${(mt+H-mb)/2}" text-anchor="middle" class="ch-t" transform="rotate(-90 16 ${(mt+H-mb)/2})">Lãi/lỗ mỗi đơn (đ)</text>
    ${ser.map((s,k)=>[s,k]).sort((a,b)=>a[0].on-b[0].on).map(([s])=>`<path d="${path(s)}" style="fill:none;stroke:${s.c};stroke-width:${s.on?3.5:2};stroke-linejoin:round"><title>${esc(s.n)} · hoà vốn ${fxT(s.be)} đơn/ngày</title></path>`).join("")}
    ${ser.filter(s=>s.be!=null).map(s=>`<circle cx="${px(s.be)}" cy="${py(s.beY)}" r="6" style="fill:${s.c};stroke:var(--panel);stroke-width:2"><title>${esc(s.n)}: hoà vốn ${fxT(s.be)} đơn/ngày</title></circle>`).join("")}
    ${lowest?`<text x="${px(lowest.be)+9}" y="${py(lowest.beY)-10}" class="ch-s" style="font-weight:600">thấp nhất: ${fxT(lowest.be)}</text>`:""}
  </svg>`;
  const others=THD.filter(d=>d[0]!==dim).map(([k,n])=>k==="trk"?lc(trkOf(selC[0]).n):k==="lab"?labName(labOf(selC[1])):`${lc(n)} ${THV[k].f(V[k])}`).join(" · ");
  return `<div class="card"><h3>${R}: lãi/lỗ mỗi đơn theo ADO</h3>
    <div class="row" style="margin:0 0 10px"><span class="lbl" style="align-self:center">Kẻ đường theo</span><div class="seg" role="group" aria-label="Kẻ đường theo">${THD.map(([k,n])=>`<button type="button" data-thd="${k}" aria-pressed="${k===dim}">${n}</button>`).join("")}</div></div>
    <div class="howto"><b>Cách đọc.</b> Mỗi đường là một lựa chọn của "${lc(THD.find(d=>d[0]===dim)[1])}"; các biến khác giữ như ô đang chọn: ${esc(others)}.
      <ul><li>Đường nằm trên vạch <b>hoà vốn</b> là lời, dưới là lỗ. <b>Chấm tròn</b> là ADO hoà vốn của đường đó; đường đậm là mức đang chọn.</li>
      <li>Về bên phải, các đường đi ngang chứ không cắm xuống: đó là lý do không có cận trên trong mô hình.</li>
      <li>Đường có răng cưa: mỗi lần phải thêm một chuyến xe hoặc thêm một người thì lãi mỗi đơn tụt xuống rồi tăng dần. Ngưỡng là mức mà từ đó tới gấp đôi không còn răng nào rơi xuống dưới hoà vốn. Lỗ sâu hơn ${f0(-yMin)}đ/đơn dồn ở đáy.</li></ul></div>
    <div class="chartbox2">${svg}</div>
    <div class="tablewrap"><table class="data"><thead><tr><th>Đường</th><th>ADO hoà vốn</th><th>Lãi mỗi đơn ở ${f0(P.ado)} đơn/ngày</th><th>Lãi mỗi đơn ở 20.000</th></tr></thead><tbody>
    ${ser.map(s=>{const a=thrProf(P,s.o,P.ado).per,z=s.y[s.y.length-1];return `<tr${s.on?' class="sel"':""}><td class="l"><i class="sw2" style="background:${s.c}"></i>${esc(s.n)}</td><td class="num"><b>${fxT(s.be)}</b></td><td class="num ${cls(a)}">${a>0?"+":""}${f0(a)}đ</td><td class="num ${cls(z)}">${z>0?"+":""}${f0(z)}đ</td></tr>`;}).join("")}</tbody></table></div></div>`;}

/* ---- Quét toàn bộ: mọi mức của mọi biến ---- */
let thrScan={};
const scanKey=(P,V)=>JSON.stringify([P.R,P.ado,V.fl,V.pay,V.sv,G.lab,G.truck,G.veh,G.save,G.prod,G.soc,socAlways,RG[P.R]]);
function scanHtml(P,V){const k=scanKey(P,V),s=thrScan[k];
  const ctx=`Lấp đầy xe ${V.fl}%, lương ${f0(V.pay/1e3)}k, tiết kiệm ${V.sv}% theo ô chọn ở trên; các biến còn lại chạy hết mọi mức.`;
  if(!s)return `<p>Chạy mọi tổ hợp: ${TRK.length} cách đi xe × ${LABM.length} cách bố trí người × ${THV.ns.lv.length} mức số SOC × ${THV.ch.lv.length} mức số chute (không ít hơn số SOC) × ${THV.mt.lv.length} mức mốc COT × ${THV.beta.lv.length} mức hàng to. Hàng to có sort hay không tự suy ra từ số chute và SOC. ${ctx}</p><button type="button" class="pri" data-thscan="1">Chạy</button>`;
  if(!s.done)return `<p>Đang chạy ${f0(s.res.length)}/${f0(s.n)} tổ hợp…</p><div class="track"><span style="width:${(s.res.length/s.n*100).toFixed(1)}%;background:var(--mark)"></span></div>`;
  const ok=s.res.filter(x=>x.v!=null),certain=ok.filter(x=>!x.cond).sort((a,b)=>a.v-b.v);
  const lo=certain[0],hi=ok.slice().sort((a,b)=>b.v-a.v)[0],never=s.res.filter(x=>x.v==null).length,under=s.res.filter(x=>x.v!=null&&x.v<=P.ado).length;
  const vv=x=>x.v==null?Infinity:x.v,medOf=a=>{const b=a.map(vv).sort((x,y)=>x-y);return b.length?b[b.length>>1]:null;};
  const DIMS=[["trk","Cách đi xe",TRK.map(t=>[t.k,t.n])],["lab","Nhóm & người",LABM.map(l=>[l.k,labName(l)])]].concat(["ns","ch","mt","beta"].map(d=>[d,THV[d].n,THV[d].lv.map(v=>[v,THV[d].f(v)])]));
  const desc=x=>`${cbName(x.tk,x.lk)} · ${Math.max(x.ns,x.ch)} chute · ${x.ns} SOC · ${x.mt} mốc COT · ${pc(x.beta)} hàng to`;
  return `<p>${ctx} Đã chạy <b>${f0(s.res.length)}</b> tổ hợp.</p>
    <dl class="kv"><dt>Hoà vốn thấp nhất (làm được ngay)</dt><dd>${lo?`<b>${fxT(lo.v)}</b> · ${esc(desc(lo))}`:"–"}</dd>
    <dt>Hoà vốn cao nhất</dt><dd>${hi?`<b>${fxT(hi.v)}</b> · ${esc(desc(hi))}`:"–"}</dd>
    <dt>Không lời ở mức nào (tới 20.000)</dt><dd>${f0(never)} tổ hợp</dd>
    <dt>Lời ngay ở ${f0(P.ado)} đơn/ngày (điển hình)</dt><dd>${f0(under)} / ${f0(s.res.length)} tổ hợp</dd></dl>
    <h4 style="margin:14px 0 4px">Mỗi biến kéo ngưỡng thế nào</h4>
    <p class="note" style="margin-top:0">Mỗi ô: trung vị ADO hoà vốn của mọi tổ hợp có mức đó. So các ô trong cùng một hàng để thấy biến đó nặng cỡ nào.</p>
    <div class="tablewrap"><table class="data"><tbody>${DIMS.map(([d,n,lv])=>`<tr><td class="l"><b>${n}</b></td>${lv.map(([v,l])=>{const m=medOf(s.res.filter(x=>x[d]===v));return `<td class="num"><span class="mini">${esc(l)}</span>${m===Infinity?"không đạt":fxT(m)}</td>`;}).join("")}${"<td></td>".repeat(6-lv.length)}</tr>`).join("")}</tbody></table></div>`;}
function runScan(){const C=thrRegs().find(r=>r.R===ui.thrR);if(!C)return;const P=C.P,V=thrVars(P),k=scanKey(P,V);
  if(thrScan[k])return;
  const jobs=[];TRK.forEach(t=>LABM.forEach(l=>THV.ns.lv.forEach(ns=>{if(!validC(t.k,l.k,ns))return;THV.mt.lv.forEach(mt=>THV.beta.lv.forEach(beta=>THV.ch.lv.forEach(ch=>{if(ch<ns)return;jobs.push({tk:t.k,lk:l.k,trk:t.k,lab:l.k,cond:!!t.cond,ns,ch,mt,beta,multi:t.multi});})));})));
