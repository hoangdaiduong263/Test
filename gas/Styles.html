<meta charset="utf-8">
<title>D2S Seller Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F5;--panel:#FFFFFF;--panel-2:#F7F9F8;
  --ink:#17211F;--ink-2:#39453F;--muted:#5E6B68;--line:#D5DCDA;--line-2:#E6EBE9;
  --profit:#1E7B55;--profit-fill:rgba(30,123,85,.13);
  --loss:#B4412F;--loss-fill:rgba(180,65,47,.12);
  --mark:#2B59C3;--mark-soft:rgba(43,89,195,.09);
  --warn:#8A5A12;--warn-fill:#FBF3E4;
  --seg-truck:#2B59C3;--seg-seller:#1E7B55;--seg-soc:#9E4E05;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121615;--panel:#1A201E;--panel-2:#212826;--ink:#E7ECEA;--ink-2:#C6CFCB;--muted:#8E9A96;--line:#2E3733;--line-2:#252D2A;
  --profit:#5CC395;--profit-fill:rgba(92,195,149,.16);--loss:#E88A75;--loss-fill:rgba(232,138,117,.14);
  --mark:#85AAF0;--mark-soft:rgba(133,170,240,.13);--warn:#E3BE79;--warn-fill:#2C2418;
  --seg-truck:#5E8FE0;--seg-seller:#3CA576;--seg-soc:#BE8433;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;}}
:root[data-theme="dark"]{
  --paper:#121615;--panel:#1A201E;--panel-2:#212826;--ink:#E7ECEA;--ink-2:#C6CFCB;--muted:#8E9A96;--line:#2E3733;--line-2:#252D2A;
  --profit:#5CC395;--profit-fill:rgba(92,195,149,.16);--loss:#E88A75;--loss-fill:rgba(232,138,117,.14);
  --mark:#85AAF0;--mark-soft:rgba(133,170,240,.13);--warn:#E3BE79;--warn-fill:#2C2418;
  --seg-truck:#5E8FE0;--seg-seller:#3CA576;--seg-soc:#BE8433;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:9px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{font:500 13px var(--sans);background:var(--panel);color:var(--ink-2);border:0;border-right:1px solid var(--line);padding:6px 11px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.lbl{font-size:12px;color:var(--muted);margin-right:6px}
.grp{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-size:clamp(24px,4.2vw,32px);line-height:1.2;margin:0 0 10px;font-weight:700;letter-spacing:-.018em;text-wrap:balance;max-width:30ch}
h2{font-size:19px;margin:0 0 6px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;margin:0 0 4px;font-weight:600}
.lede{max-width:68ch;color:var(--ink-2);margin:0}
section{margin-top:36px}
section > p{max-width:70ch;color:var(--ink-2);margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px}
.panel + .panel{margin-top:12px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:72ch}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.big{font-family:var(--mono);font-size:clamp(34px,7vw,50px);font-weight:600;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.big.good{color:var(--profit)}.big.bad{color:var(--loss)}
.unit{font-size:15px;color:var(--muted);margin-left:6px}
.story{color:var(--ink-2);font-size:14.5px;margin:10px 0 0;max-width:62ch}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:center}
.cmp-lab{font-size:12.5px;color:var(--ink-2)}
.cmp-lab b{display:block;font-family:var(--mono);font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:28px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;display:flex;overflow:hidden;gap:2px}
.track span{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:#fff;white-space:nowrap;min-width:0}
.keys{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.tablewrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:7px 9px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
table.data thead th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);vertical-align:bottom;white-space:normal;min-width:64px}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data td.l{text-align:left}
table.data td.num{font-family:var(--mono)}
table.data .pos{color:var(--profit);font-weight:600}.neg{color:var(--loss);font-weight:600}
table.data tr.tot td{font-weight:600;background:var(--panel-2)}
table.data tr.sel td{background:var(--mark-soft)}
table.data tbody tr.click{cursor:pointer}
table.data tbody tr.click:hover td{background:var(--panel-2)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:10px;letter-spacing:.02em}
.pill.g1{background:var(--profit-fill);color:var(--profit)}
.pill.g2{background:var(--warn-fill);color:var(--warn)}
.pill.g3{background:var(--loss-fill);color:var(--loss)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);padding:11px 13px;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit}
.tile[aria-pressed="true"]{background:var(--mark-soft)}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile small{display:block;font-size:11.5px;color:var(--muted)}
.chartbox{position:relative}
canvas{width:100%;height:300px;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11.5px;padding:6px 8px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;line-height:1.45;z-index:2}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2px 28px}
.p{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line-2)}
.p .nm{font-size:13.5px}.p .nm em{font-style:normal;display:block;font-size:12px;color:var(--muted)}
.p .val{display:flex;gap:5px;align-items:baseline;white-space:nowrap;font-size:12.5px;color:var(--muted)}
input.inp{font:500 14px var(--mono);border:0;border-bottom:1.5px dashed var(--mark);background:transparent;color:var(--ink);text-align:right;padding:1px 2px;width:6.5em;font-variant-numeric:tabular-nums}
input.inp.w3{width:4.4em}
input[type=checkbox]{accent-color:var(--mark);width:18px;height:18px;flex:none}
.src{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1.5px 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted);background:var(--panel-2)}
.thr{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1.5px solid var(--line)}
.thr .n{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;max-width:72ch}
.note b{color:var(--ink-2)}
.why{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px;max-width:74ch}
.why li+li{margin-top:6px}
button.ghost{font:500 12.5px var(--sans);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;color:var(--ink-2)}
button.ghost:hover{border-color:var(--mark);color:var(--mark)}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
table.it{border-collapse:collapse;font-size:13px;width:100%}
table.it th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:right;padding:0 0 6px 10px;border-bottom:1px solid var(--line);white-space:normal;vertical-align:bottom}
table.it th:first-child{text-align:left;padding-left:0}
table.it td{padding:6px 0 6px 10px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;font-variant-numeric:tabular-nums}
table.it td:first-child{text-align:left;padding-left:0;white-space:normal}
table.it td.out{font-family:var(--mono);color:var(--ink-2);white-space:normal}
table.it tr:last-child td{border-bottom:0}
select.inp{font:500 13px var(--mono);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:5px;padding:2px 4px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.cols2 .panel + .panel{margin-top:0}
.sub{font-size:12px;color:var(--muted);display:block}
.warn{color:var(--warn)}

.srow td{vertical-align:middle}
.srow.open td{background:var(--mark-soft)}
.detail td{background:var(--panel-2);padding:14px 12px!important;white-space:normal}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 22px;margin-bottom:12px}
.dgrid label{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line-2);padding:4px 0}
.tog{display:inline-flex;gap:2px}
.tog button{font:600 10.5px var(--mono);border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:4px;padding:2px 5px;cursor:pointer}
.tog button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input.code{font:500 12px var(--mono);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:2px 5px;width:9.5em}
select.inp.sm{font-size:12px;padding:1px 3px}
.mini{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap}
.status{font:500 12px var(--mono)}
.save-state{font:500 11.5px var(--mono);color:var(--muted)}
table.day td,table.day th{padding:4px 6px!important;font-size:12px}
table.day tr.off td{color:var(--muted);background:transparent}
.matrix td.best{background:var(--profit-fill);font-weight:600}
.matrix td.okc{background:var(--mark-soft)}
.matrix td.best.okc{background:var(--profit-fill);box-shadow:inset 0 0 0 1.5px var(--profit)}
.matrix td.best{box-shadow:inset 0 0 0 1.5px var(--profit)}
.matrix td.thc{cursor:pointer}.matrix td.thc:hover{outline:1px solid var(--mark);outline-offset:-2px}
.matrix td.csel{box-shadow:inset 0 0 0 2.5px var(--ink)!important;font-weight:700}
.thvs{display:flex;flex-wrap:wrap;gap:10px 16px;margin:0 0 14px}
.thv{display:flex;flex-direction:column;gap:3px;font:500 12.5px var(--sans);color:var(--muted)}
.stt{display:inline-block;font:500 11.5px var(--sans);border-radius:4px;padding:1px 7px;white-space:nowrap;border:1px solid}
.stt-ok{color:var(--profit);background:var(--profit-fill);border-color:var(--profit)}
.stt-part{color:var(--mark);background:var(--mark-soft);border-color:var(--mark)}
.stt-few,.stt-asm{color:var(--warn);background:var(--warn-fill);border-color:var(--warn)}
.stt-asm{border-style:dashed}
.stt-pull{color:var(--muted);background:var(--panel-2);border-color:var(--line)}
table.dst .stt{white-space:normal}
table.dst tr.grp td{font:600 12.5px var(--sans);color:var(--ink-2);background:var(--panel-2);text-align:left}
i.sw2{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:8px;vertical-align:middle}
.dwrap{max-width:min(1060px,calc(100vw - 72px))}
.dcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px 24px}
.dgrid label>span:first-child{flex:1;min-width:0}
.dgrid label>span:last-child{white-space:nowrap}
#drawer{position:fixed;inset:0;z-index:40}
#drawerBg{position:absolute;inset:0;background:rgba(10,14,13,.38)}
#drawerPanel{position:absolute;top:0;right:0;bottom:0;width:min(1040px,100vw);background:var(--paper);box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
#drawerBody{overflow:auto;padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));flex:1;overscroll-behavior:contain}
.dwrap{max-width:none}
.dhead{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;position:sticky;top:-16px;z-index:2;background:var(--paper);padding:10px 0;margin:-6px 0 8px;border-bottom:1px solid var(--line)}
.dhead .mini{white-space:normal}
.dgroupcodes{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:13px}
.dgroupcodes label{display:flex;gap:6px;align-items:center}
.dcols{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.why-box{margin-top:10px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px 24px}
.wgrid>div{min-width:0;overflow-wrap:anywhere}
input.inp.w6{width:8.2em}
table.day{min-width:980px}
table.day td{white-space:nowrap}
#selTable{min-width:820px}
.mini.trunc{display:block;margin-left:auto}
.trunc{display:inline-block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
#selTable select.inp.sm{max-width:110px}
#selTable td:first-child{min-width:190px}
.srow td{padding-top:6px;padding-bottom:6px}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);margin:0 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:600 14px var(--sans);background:transparent;border:0;border-bottom:2.5px solid transparent;color:var(--muted);padding:9px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1.5px;display:flex;gap:7px;align-items:baseline}
.tabs button .n{font:600 10.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button[aria-selected="true"] .n{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs button:hover{color:var(--ink)}
@media (max-width:560px){.tabs button{padding:9px 9px;font-size:13px;gap:5px}.tabs button .n{padding:0 3px}}
.tabsub{font-size:13px;color:var(--muted);margin:0 0 22px;max-width:74ch}
[role="tabpanel"][hidden]{display:none}

/* ---------- disclosure ---------- */
details.dd{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-top:10px}
details.dd>summary{cursor:pointer;padding:10px 14px;font:600 13.5px var(--sans);color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>summary::before{content:"▸";font-size:11px;color:var(--muted);transition:transform .12s}
details.dd[open]>summary::before{transform:rotate(90deg)}
details.dd>summary:hover{color:var(--mark)}
details.dd>summary .tag{margin-left:auto;font:500 11.5px var(--mono);color:var(--muted)}
details.dd .ddbody{padding:0 14px 14px;border-top:1px solid var(--line-2);margin-top:-1px;padding-top:12px}

/* ---------- texture: hàng "lãng phí" dùng cùng hue với mark gốc + vân 45° ---------- */
.tex{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.42) 0 2px,transparent 2px 6px)}
@media (prefers-reduced-motion:reduce){details.dd>summary::before{transition:none}}

/* ---------- waterfall / decomposition ---------- */
.wf{display:flex;flex-direction:column;gap:9px}
.wf-row{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center}
.wf-lab{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.wf-lab em{font-style:normal;display:block;font-size:11.5px;color:var(--muted)}
.wf-val{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.wf-row{grid-template-columns:minmax(0,1fr) 86px}.wf-lab{grid-column:1/-1}}

/* ---------- plan cards ---------- */
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:13px 15px}
.pcard h4{margin:0 0 2px;font-size:14px}
.pcard .sub{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.pcard dl{display:grid;grid-template-columns:auto auto;gap:3px 10px;margin:0;font-size:12.5px}
.pcard dt{color:var(--muted)}
.pcard dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.pcard .fin{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.pcard .fin b{font-family:var(--mono);font-size:17px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:9px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block;flex:none}

/* ---------- form hồ sơ seller mới ---------- */
#npForm{display:block;columns:330px 3;column-gap:30px}
#npForm>div{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;margin:0 0 16px;display:inline-block;width:100%}
#npForm .dgrid label{align-items:center;gap:12px;flex-wrap:nowrap}
#npForm .dgrid label>span:first-child{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
#npForm .dgrid label>span:last-child{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#npForm select.inp.sm{max-width:15em}
#npForm{columns:auto!important;display:block!important;min-width:0}
#npForm details,#npForm .ddbody{min-width:0;max-width:100%}
@media (max-width:560px){table.npt td:first-child{min-width:120px}}
#npForm .nphead{display:flex;flex-wrap:wrap;gap:10px 28px;margin:0 0 10px}
#npForm .nphead label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-2)}
#npForm .nphead label .mini{white-space:normal}
table.npt td,table.npt th{text-align:center;white-space:nowrap}
table.npt td:first-child{text-align:left;white-space:normal;min-width:190px}
