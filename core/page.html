<meta charset="utf-8">
<title>D2S Core Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Tối giản: một cột, một con số chính, danh sách tuyến bấm để mở; viền mảnh, một màu nhấn */
:root{
  --bg:#fafafa; --panel:#ffffff; --ink:#111418; --muted:#6b7280; --line:#e7e8eb; --soft:#f3f4f6;
  --accent:#2445c4; --accent-soft:#eef1fc;
  --ok:#17803d; --ok-soft:#e8f5ec; --bad:#c2352b; --bad-soft:#fcebe9; --warn:#b26a00;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#15181e; --ink:#e8eaee; --muted:#9097a3; --line:#262a33; --soft:#1c2028;
  --accent:#93a8ff; --accent-soft:#1d2440; --ok:#5ec48f; --ok-soft:#14291d; --bad:#ff8c80; --bad-soft:#341a18; --warn:#f0a63a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#15181e; --ink:#e8eaee; --muted:#9097a3; --line:#262a33; --soft:#1c2028;
  --accent:#93a8ff; --accent-soft:#1d2440; --ok:#5ec48f; --ok-soft:#14291d; --bad:#ff8c80; --bad-soft:#341a18; --warn:#f0a63a; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);margin:0}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.wrap>*,#plan>*{min-width:0}
#plan{display:grid;gap:28px}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;margin:0}
h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.pos{color:var(--ok)}.neg{color:var(--bad)}.warn{color:var(--warn)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* đầu trang */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 10px;border-radius:8px;display:flex;gap:6px;align-items:baseline;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink);font-weight:600}
.tabs small{font-family:var(--f-mono);font-size:11px}
.lines{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;justify-self:start}
.lines button{border:0;background:none;border-radius:999px;padding:4px 14px;font-size:13px;color:var(--muted)}
.lines button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* con số chính */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 32px}
.hero .lab{font-size:12px;color:var(--muted)}
.hero .val{font:600 44px/1.05 var(--f-mono);letter-spacing:-.03em}
.hero .val span{font-size:16px;color:var(--muted);letter-spacing:0}
.hero .sub{font-size:13px;color:var(--muted);margin-top:4px}
.facts{list-style:none;margin:0;padding:0;display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.facts b{display:block;font:600 20px/1.2 var(--f-mono);color:var(--ink)}.facts .neg b{color:var(--bad)}
.hero .btn{margin-left:auto}

/* danh sách tuyến / nhóm */
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.sh .muted{font-size:12px}
.it{border-bottom:1px solid var(--line)}
.it .row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 4px;cursor:pointer}
.it .row:hover{background:var(--soft)}
.it .no{color:var(--muted);font-size:12px}
.it .nm{font-weight:500}
.it .meta{font-size:12px;margin-top:2px}
.it .v{font-weight:600;font-size:15px;text-align:right}
.it .v small{display:block;font:400 10.5px var(--f-body);color:var(--muted)}
.grp{border-bottom:1px solid var(--line)}.grp .gh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 4px 4px;font-size:12px;color:var(--muted)}.grp .gh .mono{font-weight:600}
.it.in{border-bottom:0;margin-left:16px;border-left:2px solid var(--line)}
.gside{font-size:12px;padding:0 4px 6px}
.note3{font-size:12px;padding:10px 4px}
.it.open{background:var(--panel)}
.it .body{padding:4px 4px 18px 44px;display:grid;gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
@media (max-width:600px){.it .body{padding-left:4px}}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kv dd.tx{font-family:var(--f-body)}
.notes{margin:0;padding-left:16px;font-size:12.5px;display:grid;gap:4px}
.rk{margin-bottom:10px}.rkh{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:13px}.rkh .muted{font-size:12px}
table.mini{font-size:12.5px;margin-top:4px}table.mini td{padding:3px 8px 3px 0;border:0}
details.sch>summary,details.more>summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
details.sch>summary::before,details.more>summary::before{content:"▸ ";}
details.sch[open]>summary::before,details.more[open]>summary::before{content:"▾ ";}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more>summary{color:var(--ink);font-weight:500}
.mb{padding:10px 0 4px;display:grid;gap:10px}
.rt{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}.rt i{font-style:normal;color:var(--muted)}
.pt{white-space:nowrap}

/* bảng */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:500;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.tl{font-size:12.5px}.tl td.slot{font-weight:600;white-space:nowrap}
.chip{display:inline-flex;font:600 10.5px/1.7 var(--f-mono);padding:0 7px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--accent-soft);color:var(--accent)}

/* kiểm định */
#calib{display:grid;gap:24px}#calib[hidden]{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile{background:var(--panel);padding:14px 16px;display:grid;gap:4px}
.tile .th{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.tile .tv{font-size:24px;font-weight:600}.tile .tl2{font-size:12px;color:var(--muted)}

/* chỉnh tay, tham số, chung */
.ovr{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 14px;border-left:3px solid var(--warn);background:var(--panel);font-size:13px}
.ovr b{color:var(--warn)}.ovr .muted{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
details.prm{border-top:1px solid var(--line);padding-top:12px}
details.prm>summary{cursor:pointer;font-weight:500;list-style:none}
details.prm>summary::before{content:"▸ "}details.prm[open]>summary::before{content:"▾ "}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 24px;padding:4px 0 12px}
.pgrid h3{grid-column:1/-1;margin:12px 0 2px}
.pf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.pf label{min-width:0}.pf span.u{color:var(--muted);font-size:12px;margin-left:4px}
.pf input{width:84px;font:13px var(--f-mono);text-align:right;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.pbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:8px;padding:6px 14px;font-weight:500}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.empty{padding:16px 4px;color:var(--muted)}
.busy{opacity:.55;pointer-events:none}
.big{font:600 26px/1.1 var(--f-mono)}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
/* live */
.play{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:6px;width:26px;height:24px;font-size:11px;line-height:1}
.play:hover{background:var(--accent);color:var(--panel)}
.play.sm{width:22px;height:20px;font-size:9px;margin-right:6px;vertical-align:middle}
.lv-rt{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.lv-rt button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;max-width:100%;text-align:left}
.lv-rt button b{margin-right:4px}
.lv-rt button:hover{border-color:var(--accent)}
.lv-rt button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.lv-rt button.bad:not([aria-selected="true"]){border-color:var(--bad)}
.lv-rk{border:1px dashed var(--line);border-radius:999px;padding:4px 12px;font-size:12px}
.lv-tmv{fill:var(--muted);opacity:.45}
.lv-tsort{fill:var(--accent);opacity:.85}
.lv-thold{fill:var(--accent);opacity:.3}
.lv-team.load .bg{fill:var(--accent);opacity:.7}
.lv-tlab{font:600 10px var(--f-mono);fill:var(--panel)}
.lv-tdep{fill:var(--ok)}.lv-tdep.late{fill:var(--bad)}
.lv>header .x{border:0;background:none;color:var(--muted);font-size:16px;margin-left:auto}
.lv-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.lv-clock{font-size:24px;font-weight:600;min-width:76px}
.lv-ctl input[type=range]{flex:1 1 220px;min-width:0;accent-color:var(--accent)}
.lv-ctl select{font:inherit;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.lv-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:0}
@media (max-width:860px){.lv-grid{grid-template-columns:1fr}}
.lv-map{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.lv-map svg{width:100%;height:auto;display:block;background:var(--soft);border-radius:8px}
.lv-route{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:5 4}
.lv-soc{fill:var(--ink)}.lv-hub{fill:var(--muted)}
.lv-lab{font:600 11px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--soft);stroke-width:3px}
.lv-lab.sm{font-weight:400;fill:var(--muted)}.c{text-anchor:middle}
.lv-st{font:600 10px var(--f-mono);paint-order:stroke;stroke:var(--soft);stroke-width:3px;fill:var(--muted)}
.lv-pt{stroke:var(--panel);stroke-width:2;transition:fill .2s}
.lv-ring{fill:none;stroke-width:3;stroke:transparent}
.s-idle{fill:var(--muted);background:var(--muted)}.s-sort{fill:var(--warn);background:var(--warn)}.s-ready{fill:var(--ok);background:var(--ok)}
.s-load{fill:var(--accent);background:var(--accent)}.s-done{fill:var(--line);background:var(--line)}.s-late{fill:var(--bad);background:var(--bad)}
.lv-ring.s-late{stroke:var(--bad);fill:none;animation:pulse 1s infinite}.lv-ring.s-load{stroke:var(--accent);fill:none}
@keyframes pulse{50%{stroke-opacity:.2}}
.lv-truck rect{fill:var(--accent)}.lv-truck.late rect{fill:var(--bad)}.lv-truck text{font:600 10px var(--f-mono);fill:var(--panel)}
.lv-team .bg{fill:var(--warn);stroke:var(--panel);stroke-width:2}.lv-team .fg{fill:var(--panel)}
.lv-team.mv .bg{fill:var(--accent)}.lv-team.wait .bg{fill:var(--muted)}.lv-team.idle .bg{fill:var(--ok)}
.lv-tname{font:700 10px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.lv-tst{font:500 9.5px var(--f-body);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.lv-tname.e,.lv-tst.e{text-anchor:end}
.lv-ext .lv-ring{fill:var(--soft);stroke:var(--muted);stroke-dasharray:3 3;opacity:.8}.lv-ext text{fill:var(--muted)}
.lv-tpath{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:3 4;opacity:.8}
.lv-kpi .wide{grid-column:1/-1}
.lv-map{position:relative}
.lv-zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:1}
.lv-zoom button{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:600 15px/1 var(--f-body);cursor:pointer}
.lv-zoom button:hover{border-color:var(--accent)}
#lv-svg{touch-action:none;cursor:grab}
.lv-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);padding-top:8px}
.lv-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.lv-side{display:grid;grid-template-rows:auto 1fr;min-width:0}
.lv-kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.lv-kpi div{background:var(--panel);padding:8px 12px;display:grid}
.lv-kpi span{font-size:11px;color:var(--muted)}.lv-kpi b{font-size:18px}.lv-kpi .bad b{color:var(--bad)}
.lv-log{list-style:none;margin:0;padding:6px 0;max-height:420px;overflow:auto;font-size:12.5px}
.lv-log li{display:flex;gap:8px;padding:4px 12px;border-left:3px solid transparent}
.lv-log li span{color:var(--muted);flex:none}
.lv-log li.late{border-left-color:var(--bad);color:var(--bad)}.lv-log li.ok{border-left-color:var(--ok)}.lv-log li.sort{border-left-color:var(--warn)}
.lv-log li.new{background:var(--accent-soft)}
.lv-invw{border-top:1px solid var(--line);padding:10px 16px 14px}
.lv-s-dep{fill:var(--accent);opacity:.18}.lv-s-arr{fill:var(--accent);opacity:.7}
.lv-k-dep{background:var(--accent);opacity:.25}.lv-k-arr{background:var(--accent);opacity:.75}
.lv-edit{border-top:1px solid var(--line)}.lv-edit>summary{cursor:pointer;padding:10px 16px;font-size:13px;font-weight:500;list-style:none}.lv-edit>summary::before{content:"▸ "}.lv-edit[open]>summary::before{content:"▾ "}
.lv-dlw{padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.lv-dlt td,.lv-dlt th{padding:5px 8px}
.lv-dlt .dlp{display:flex;gap:4px;align-items:center}
.lv-dlt input.hc{width:56px}
.lv-trt .trs{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline;font-size:12px}
.lv-trt .trs i{font-style:normal;color:var(--muted)}.lv-trt .trs b{font-weight:600}
.lv-dlt tr.all td{background:var(--soft);font-size:12px;font-weight:600}
.lv-dlt td small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
.lv-dlt input{width:62px;text-align:center;font:13px var(--f-mono);background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.lv-dlt input.ov{border-color:var(--warn)}.lv-dlt input.chg{border-color:var(--accent);background:var(--accent-soft)}
.lv-ih{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:6px}
.lv-ih h3{font-size:13px;margin:0}.lv-ih .lv-leg{padding:0}
.lv-invw svg{width:100%;min-width:560px;height:auto;display:block}
.lv-a-u{fill:var(--warn);opacity:.75}.lv-a-s{fill:var(--ok);opacity:.65}.lv-a-late{fill:var(--bad);opacity:.85}
.lv-grid{stroke:var(--line);stroke-width:1}.lv-base{stroke:var(--line)}
.lv-ax{font:10px var(--f-mono);fill:var(--muted)}
.lv-dl{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 2}.lv-dl.late{stroke:var(--bad)}
.lv-dlk{display:inline-block;width:0;height:10px;border-left:1.5px dashed var(--muted);margin-right:5px;vertical-align:-1px}
.lv-now{stroke:var(--accent);stroke-width:1.5}
.lv-val{font:600 11px var(--f-mono);fill:var(--muted)}.lv-val.bad{fill:var(--bad)}
.lv-lab.l{text-anchor:start}
@media (prefers-reduced-motion:no-preference){.step,.card{transition:opacity .15s}}
</style>

<div class="wrap">
  <div class="top">
    <h1>D2S Planner</h1>
    <div class="tabs" id="tabs" role="tablist" aria-label="Vùng"></div>
  </div>
  <nav class="lines" id="lines" aria-label="Xem"><button type="button" data-line="1">Kế hoạch</button><button type="button" data-line="0">Kiểm định</button></nav>
  <div id="calib" hidden></div>
  <div id="plan">
  <div class="ovr" id="ovr" hidden></div>
  <section id="sum"></section>
  <section class="card lv" id="live" hidden></section>
  <section id="routes"></section>
  <section id="teams"></section>
  <details class="more" id="chute"></details>
  <details class="more" id="more"></details>
  <details class="prm" id="prm"><summary>Tham số</summary><div id="pform"></div></details>
  </div>
</div>

<script>/*DATA*/</script>
<script>/*ENGINE*/</script>
<script>/*CALIB*/</script>
<script>/*LIVE*/</script>
<script>/*UI*/</script>
