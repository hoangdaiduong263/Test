<title>D2S Core Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: một cột làm việc — tab vùng · dải 2 bước (Linehaul → Headcount) · bảng gói · tuyến bị loại · tham số */
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#162033; --muted:#5a6579; --line:#dde2ea; --soft:#eef1f6;
  --accent:#2445c4; --accent-soft:#e7ecfb;
  --ok:#1c7a4e; --ok-soft:#e3f3ea; --bad:#b3332a; --bad-soft:#fbe8e6; --warn:#b26a00;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --panel:#151c27; --ink:#e5eaf2; --muted:#9aa4b6; --line:#273143; --soft:#1b2433;
  --accent:#93a8ff; --accent-soft:#1e2846; --ok:#5ec48f; --ok-soft:#132c1e; --bad:#ff8c80; --bad-soft:#371a18; --warn:#f0a63a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131b; --panel:#151c27; --ink:#e5eaf2; --muted:#9aa4b6; --line:#273143; --soft:#1b2433;
  --accent:#93a8ff; --accent-soft:#1e2846; --ok:#5ec48f; --ok-soft:#132c1e; --bad:#ff8c80; --bad-soft:#371a18; --warn:#f0a63a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.wrap>*,#plan>*{min-width:0}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;margin:0;text-wrap:balance}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;display:flex;gap:8px;align-items:baseline}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* dải 2 bước */
.ovr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border:1px solid var(--warn);border-radius:10px;background:var(--panel)}
.ovr b{color:var(--warn)}
.ovr .muted{font-size:12px}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.step.res{border-color:var(--accent)}
.step h2{display:flex;gap:8px;align-items:center}
.step h2 .n{font:600 11px/1 var(--f-mono);border:1px solid currentColor;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center}
.big{font:600 26px/1.1 var(--f-mono);letter-spacing:-.02em}
.big.pos{color:var(--ok)}.big.neg{color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.arrow{align-self:center;color:var(--muted);font-size:18px}
@media (max-width:820px){.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);justify-self:center}}

/* bảng gói */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.pk{cursor:pointer}
tr.pk:hover td{background:var(--soft)}
tr.pk[aria-expanded="true"] td{background:var(--soft)}
.rt{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pt{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap;font-size:12.5px}
.rt i{font-style:normal;color:var(--muted)}
.grp{display:grid;gap:6px}
.chip{display:inline-flex;gap:4px;align-items:center;font:600 11px/1.6 var(--f-mono);padding:0 7px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* chi tiết tuyến */
.det td{background:var(--bg);padding:12px 16px 16px}
.route{display:grid;gap:8px;padding:10px 0;border-top:1px dashed var(--line)}
.route:first-child{border-top:0;padding-top:0}
.rhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.rhead b{font-weight:600}
.tl{font-size:12.5px}
.tl th{font-size:10.5px;padding:5px 8px;background:var(--panel)}
.tl td{padding:5px 8px;background:var(--panel)}
.tl td.slot{font-weight:600;white-space:nowrap}
.late{font-weight:600}

/* tuyến bị loại */
.bans{display:grid;gap:8px;padding:12px 16px}
.ban{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;font-size:13px}
.ban .it{font:600 11px/1.9 var(--f-mono);color:var(--muted);min-width:52px}

/* tham số */
details.prm>summary{padding:12px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.prm>summary::-webkit-details-marker{display:none}
details.prm>summary::after{content:"▾";color:var(--muted)}
details.prm[open]>summary::after{content:"▴"}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 24px;padding:4px 16px 12px}
.pgrid h3{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 2px}
.pf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.pf label{min-width:0}
.pf span.u{color:var(--muted);font-size:12px;margin-left:4px}
.pf input{width:84px;font:13px var(--f-mono);text-align:right;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.pbar{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:8px;padding:6px 14px;font-weight:600}
.btn.ghost{background:none;color:var(--accent)}
.empty{padding:16px;color:var(--muted)}
.busy{opacity:.55;pointer-events:none}
/* dây chuyền */
.lines{display:flex;gap:6px;flex-wrap:wrap}
.lines button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:500}
.lines button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#calib{display:grid;gap:18px}#calib[hidden]{display:none}
.gate{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gate .step h2{justify-content:space-between}
.note2{font-size:12px;color:var(--muted);margin:0}
/* live */
.play{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:6px;width:26px;height:24px;font-size:11px;line-height:1}
.play:hover{background:var(--accent);color:var(--panel)}
.play.sm{width:22px;height:20px;font-size:9px;margin-right:6px;vertical-align:middle}
.lv-rt{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.lv-rt button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;max-width:100%;text-align:left}
.lv-rt button b{margin-right:4px}
.lv-rt button:hover{border-color:var(--accent)}
.lv-rt button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.lv-rt button.bad:not([aria-selected="true"]){border-color:var(--bad)}
.lv-rk{border:1px dashed var(--line);border-radius:999px;padding:4px 12px;font-size:12px}
.lv-tmv{fill:var(--muted);opacity:.45}
.lv-tsort{fill:var(--accent);opacity:.85}
.lv-tlab{font:600 10px var(--f-mono);fill:var(--panel)}
.lv-tdep{fill:var(--ok)}.lv-tdep.late{fill:var(--bad)}
.lv>header .x{border:0;background:none;color:var(--muted);font-size:16px;margin-left:auto}
.lv-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.lv-clock{font-size:24px;font-weight:600;min-width:76px}
.lv-ctl input[type=range]{flex:1 1 220px;min-width:0;accent-color:var(--accent)}
.lv-ctl select{font:inherit;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.lv-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:0}
@media (max-width:860px){.lv-grid{grid-template-columns:1fr}}
.lv-map{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.lv-map svg{width:100%;height:auto;display:block;background:var(--soft);border-radius:8px}
.lv-route{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:5 4}
.lv-soc{fill:var(--ink)}.lv-hub{fill:var(--muted)}
.lv-lab{font:600 11px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--soft);stroke-width:3px}
.lv-lab.sm{font-weight:400;fill:var(--muted)}.c{text-anchor:middle}
.lv-st{font:600 11px var(--f-mono);paint-order:stroke;stroke:var(--soft);stroke-width:3px;fill:var(--ink)}
.lv-pt{stroke:var(--panel);stroke-width:2;transition:fill .2s}
.lv-ring{fill:none;stroke-width:3;stroke:transparent}
.s-idle{fill:var(--muted);background:var(--muted)}.s-sort{fill:var(--warn);background:var(--warn)}.s-ready{fill:var(--ok);background:var(--ok)}
.s-load{fill:var(--accent);background:var(--accent)}.s-done{fill:var(--line);background:var(--line)}.s-late{fill:var(--bad);background:var(--bad)}
.lv-ring.s-late{stroke:var(--bad);fill:none;animation:pulse 1s infinite}.lv-ring.s-load{stroke:var(--accent);fill:none}
@keyframes pulse{50%{stroke-opacity:.2}}
.lv-truck rect{fill:var(--accent)}.lv-truck.late rect{fill:var(--bad)}.lv-truck text{font:600 10px var(--f-mono);fill:var(--panel)}
.lv-team .bg{fill:var(--warn);stroke:var(--panel);stroke-width:2}.lv-team .fg{fill:var(--panel)}
.lv-team.mv .bg{fill:var(--accent)}.lv-team.wait .bg{fill:var(--muted)}.lv-team.idle .bg{fill:var(--ok)}
.lv-tname{font:700 10px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.lv-tst{font:500 9.5px var(--f-body);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.lv-tpath{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:3 4;opacity:.8}
.lv-kpi .wide{grid-column:1/-1}
.lv-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);padding-top:8px}
.lv-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.lv-side{display:grid;grid-template-rows:auto 1fr;min-width:0}
.lv-kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.lv-kpi div{background:var(--panel);padding:8px 12px;display:grid}
.lv-kpi span{font-size:11px;color:var(--muted)}.lv-kpi b{font-size:18px}.lv-kpi .bad b{color:var(--bad)}
.lv-log{list-style:none;margin:0;padding:6px 0;max-height:420px;overflow:auto;font-size:12.5px}
.lv-log li{display:flex;gap:8px;padding:4px 12px;border-left:3px solid transparent}
.lv-log li span{color:var(--muted);flex:none}
.lv-log li.late{border-left-color:var(--bad);color:var(--bad)}.lv-log li.ok{border-left-color:var(--ok)}.lv-log li.sort{border-left-color:var(--warn)}
.lv-log li.new{background:var(--accent-soft)}
.lv-invw{border-top:1px solid var(--line);padding:10px 16px 14px}
.lv-dlw{padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.lv-dlt td,.lv-dlt th{padding:5px 8px}
.lv-dlt .dlp{display:flex;gap:4px;align-items:center}
.lv-dlt input.hc{width:56px}
.lv-trt .trs{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline;font-size:12px}
.lv-trt .trs i{font-style:normal;color:var(--muted)}.lv-trt .trs b{font-weight:600}
.lv-dlt tr.all td{background:var(--soft);font-size:12px;font-weight:600}
.lv-dlt td small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
.lv-dlt input{width:62px;text-align:center;font:13px var(--f-mono);background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.lv-dlt input.ov{border-color:var(--warn)}.lv-dlt input.chg{border-color:var(--accent);background:var(--accent-soft)}
.lv-ih{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:6px}
.lv-ih h3{font-size:13px;margin:0}.lv-ih .lv-leg{padding:0}
.lv-invw svg{width:100%;min-width:560px;height:auto;display:block}
.lv-a-u{fill:var(--warn);opacity:.75}.lv-a-s{fill:var(--ok);opacity:.65}.lv-a-late{fill:var(--bad);opacity:.85}
.lv-grid{stroke:var(--line);stroke-width:1}.lv-base{stroke:var(--line)}
.lv-ax{font:10px var(--f-mono);fill:var(--muted)}
.lv-dl{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 2}.lv-dl.late{stroke:var(--bad)}
.lv-dlk{display:inline-block;width:0;height:10px;border-left:1.5px dashed var(--muted);margin-right:5px;vertical-align:-1px}
.lv-now{stroke:var(--accent);stroke-width:1.5}
.lv-val{font:600 11px var(--f-mono);fill:var(--muted)}.lv-val.bad{fill:var(--bad)}
.lv-lab.l{text-anchor:start}
@media (prefers-reduced-motion:no-preference){.step,.card{transition:opacity .15s}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><h1>D2S Core</h1><span class="sub">Dữ liệu &amp; kiểm định → Plan linehaul → Plan HC → Lọc khả thi → Live</span></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Vùng"></div>
  </div>
  <nav class="lines" id="lines" aria-label="Dây chuyền"><button type="button" data-line="0">0 · Dữ liệu &amp; kiểm định as-is</button><button type="button" data-line="1">1–4 · Kế hoạch, lọc &amp; live</button></nav>
  <div id="calib" hidden></div>
  <div id="plan">
  <div class="ovr" id="ovr" hidden></div>
  <div class="flow" id="flow"></div>
  <section class="card lv" id="live" hidden></section>
  <section class="card" id="packs"></section>
  <section class="card" id="teams"></section>
  <section class="card" id="bans"></section>
  <details class="card prm" id="prm"><summary>Tham số</summary><div id="pform"></div></details>
  </div>
</div>

<script>/*DATA*/</script>
<script>/*ENGINE*/</script>
<script>/*CALIB*/</script>
<script>/*LIVE*/</script>
<script>/*UI*/</script>
