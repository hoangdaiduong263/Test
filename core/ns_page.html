<title>D2S New Seller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: hồ sơ seller (cột trái, 5 nhóm đầu vào như box 3) → kế hoạch (cột phải: dải kết luận, xe × lượt, rủi ro COT, người, chi phí/đơn) */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#16213a; --ink2:#5b6478; --line:#e2e5ec; --soft:#eef1f6;
  --accent:#ee4d2d; --accent-soft:#fdeee9; --navy:#142b52; --navy-soft:#e8edf6;
  --good:#1f8a52; --good-soft:#e5f4ec; --warn:#b7791f; --warn-soft:#fbf1df; --bad:#c2362a; --bad-soft:#fbe7e5;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141c; --panel:#171c26; --ink:#e6e9f0; --ink2:#9aa3b5; --line:#2a3140; --soft:#1e2430;
  --accent:#ff6a4a; --accent-soft:#3a1e18; --navy:#9db5e0; --navy-soft:#1d2738;
  --good:#4cc488; --good-soft:#15291f; --warn:#e3a94a; --warn-soft:#2e2414; --bad:#ff7a6e; --bad-soft:#36191a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --panel:#171c26; --ink:#e6e9f0; --ink2:#9aa3b5; --line:#2a3140; --soft:#1e2430;
  --accent:#ff6a4a; --accent-soft:#3a1e18; --navy:#9db5e0; --navy-soft:#1d2738;
  --good:#4cc488; --good-soft:#15291f; --warn:#e3a94a; --warn-soft:#2e2414; --bad:#ff7a6e; --bad-soft:#36191a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;padding:0 16px;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:12px}
header .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{margin:2px 0 0;font-size:24px;font-weight:700;text-wrap:balance}
header p{margin:4px 0 0;color:var(--ink2);max-width:68ch}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--panel);color:var(--ink2);padding:6px 12px;font:600 12px var(--f-ui);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--panel)}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.inputs{display:grid;gap:14px}
.grp{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;padding-top:0}
.grp h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);display:flex;justify-content:space-between;gap:8px}
.grp h3 span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink2)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.row label{color:var(--ink2);font-size:13px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.trio label{font-size:11px;color:var(--ink2);display:grid;gap:2px}
.cub{display:grid;gap:8px}.cutab{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.cutab button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink2);cursor:pointer}.cutab button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}.cutab label{font-size:12px;color:var(--ink2);display:flex;gap:4px;align-items:center;margin-left:auto}
.chu{border:1px dashed var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;background:var(--panel)}.chu.ov{border-color:var(--navy);background:var(--good-soft)}.chu .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}.chu .hd button{font:inherit;border:0;background:none;color:var(--ink2);cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:26px}.chip2{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);cursor:grab;user-select:none}.chip2.sel{outline:2px solid var(--navy)}.chips .ph{font-size:11.5px;color:var(--ink2)}
.chu select{font:inherit;font-size:12px;width:100%}.chu .eff{font-size:11.5px;color:var(--ink2)}.chu .eff b{font-weight:600;color:var(--ink)}.cuadd{font:inherit;font-size:12px;padding:5px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--ink2);cursor:pointer}
.cu{width:100%;border-collapse:collapse;font-size:12px}.cu th{font-size:11px;font-weight:600;color:var(--ink2);text-align:center;padding:2px 4px}.cu th:first-child,.cu td:first-child{text-align:left}.cu td{padding:3px 4px;text-align:center;border-top:1px solid var(--line)}.cu .meta{font-size:10.5px}
input,select{font:500 13px var(--f-ui);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{font-family:var(--f-num);width:100%;text-align:right}
.row input[type=number]{width:96px}
select{max-width:200px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:11.5px;color:var(--ink2);margin:0}
.out{display:grid;gap:16px;min-width:0}
.verdict{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:640px){.verdict{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);padding:12px 14px;display:grid;gap:2px;align-content:start}
.kpi .l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.kpi .v{font:600 22px var(--f-num);letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--ink2)}
.kpi.hero{background:var(--navy-soft)}
.inputs:not(.adv-on) .adv{display:none}
.pre{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pre label{font-size:12px;font-weight:600;color:var(--navy)}
.pre select{max-width:none;width:100%}
.ghost{grid-column:1/-1;justify-self:start;font:600 12px var(--f-ui);color:var(--navy);background:var(--navy-soft);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.upd{display:grid;gap:16px}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:820px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts div{background:var(--panel);padding:12px 14px;display:grid;gap:2px;align-content:start}
.facts b{font:600 20px var(--f-num);letter-spacing:-.02em}
.facts span{font-size:12px;color:var(--ink2)}
.st{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 12px;align-items:start}
.st li{display:contents}
.st .chip{justify-self:start}
.ph{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.ph{grid-template-columns:minmax(0,1fr)}}
.ph h3{margin:0 0 4px;font-size:15px}.ph .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.ph ol{margin:8px 0 0;padding-left:18px;display:grid;gap:8px}
.ph li span.eta{display:inline-block;margin-left:6px;font:600 11px var(--f-num);color:var(--navy);background:var(--navy-soft);border-radius:4px;padding:1px 6px;white-space:nowrap}
.gantt{display:grid;gap:6px;overflow-x:auto;min-width:0}
.gr{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px}
.gantt>.gr{min-width:520px}
.gr .tl{position:relative;height:22px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.gr .tl .ml{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gr .tl .bar{position:absolute;top:8px;height:6px;border-radius:3px;background:var(--navy-soft)}
.gr .tl .m{position:absolute;top:3px;width:12px;height:12px;transform:translateX(-6px) rotate(45deg);background:var(--accent);border-radius:2px}
.gr .tl .d{position:absolute;top:2px;font:600 11px var(--f-num);color:var(--ink2);white-space:nowrap}
.gr .tl .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--navy)}
.gr.ax{color:var(--ink2);font-size:11px}.gr.ax .tl{background:none;height:14px}.gr.ax .tl span{position:absolute;top:0}
.next{margin:0;padding-left:18px;display:grid;gap:6px}
.cta{justify-self:start;font:600 13px var(--f-ui);color:var(--panel);background:var(--navy);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.tabs{width:max-content;max-width:100%;flex-wrap:wrap}
.tabs button{padding:8px 16px;font-size:13px;flex:1 0 auto}
.asm{display:grid;gap:16px}
.asm .lead{margin:0;color:var(--ink2);max-width:80ch}
.asm table{width:100%;border-collapse:collapse;font-size:13px}
.asm th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.asm td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.asm td:first-child{width:26%;font-weight:600}
.asm td:nth-child(2){width:38%}
.asm td.src{color:var(--ink2);font-size:12px}
.asm .num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.asm .chip{white-space:nowrap}
.asm .cur{background:var(--navy-soft)}
.cons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.cons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cons{grid-template-columns:minmax(0,1fr)}}
.con{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;align-content:start;background:var(--panel)}
.con h3{margin:0;font-size:14px;display:flex;gap:8px;align-items:baseline}
.con h3 i{font:600 11px var(--f-num);color:var(--accent);font-style:normal}
.con p{margin:0;font-size:12.5px;color:var(--ink2)}
.con .io{font-size:12px;display:grid;gap:2px;border-top:1px dashed var(--line);padding-top:6px}
.con .io b{font-weight:600;color:var(--navy)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.sec h2{margin:0 0 2px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec h2 i{font-style:normal;font:600 11px var(--f-num);color:var(--panel);background:var(--accent);border-radius:4px;padding:1px 6px}
.sec .sub{margin:0 0 10px;color:var(--ink2);font-size:12.5px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-num)}
.cot{font:600 13px var(--f-num)} .cot small{display:block;font:400 11px var(--f-ui);color:var(--ink2)}
.mix{display:flex;flex-wrap:wrap;gap:4px}
.truck{font:600 12px var(--f-num);background:var(--navy-soft);color:var(--navy);border-radius:4px;padding:2px 6px;white-space:nowrap}
.fillbar{height:5px;background:var(--soft);border-radius:3px;margin-top:6px;overflow:hidden;max-width:140px}
.fillbar b{display:block;height:100%;background:var(--navy)}
.meta{font-size:11.5px;color:var(--ink2);margin-top:3px;font-family:var(--f-num)}
.chip{display:inline-block;font:600 11.5px var(--f-ui);border-radius:999px;padding:2px 8px;white-space:nowrap}
.ok{background:var(--good-soft);color:var(--good)} .mid{background:var(--warn-soft);color:var(--warn)} .late{background:var(--bad-soft);color:var(--bad)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:12.5px}
.track{position:relative;height:22px;background:var(--soft);border-radius:4px;overflow:hidden;display:flex}
.track .t{background:var(--navy)} .track .p{background:var(--accent)} .track .so{background:var(--warn)}
.track .fm{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.cap td{padding:5px 8px}
.socs{display:grid;gap:4px}
.socs .sr{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px;gap:6px;align-items:center;font-size:12.5px}
.socs .sr.h{font-size:11px;color:var(--ink2)}
.socs .sr span{min-width:0;overflow-wrap:anywhere}
.socs .sr.h span:not(:first-child){text-align:right}
.socs .sr input[type=checkbox]{justify-self:center;width:16px;height:16px;accent-color:var(--navy)}
.legs{display:grid;gap:2px;margin-top:4px}
.vdp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px 24px;border-width:2px}
@media (max-width:760px){.vdp{grid-template-columns:minmax(0,1fr)}}
.vdp.go{border-color:var(--good)} .vdp.cond{border-color:var(--warn)} .vdp.no{border-color:var(--bad)}
.vd-h{display:grid;gap:6px;align-content:start}
.vd-h .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.vd-h .t{font-size:24px;font-weight:700;line-height:1.2}
.vdp.go .vd-h .t{color:var(--good)} .vdp.cond .vd-h .t{color:var(--warn)} .vdp.no .vd-h .t{color:var(--bad)}
.vd-h p{margin:0;color:var(--ink2);font-size:13px}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.chk li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:baseline}
.chk b{font:600 11px var(--f-ui);border-radius:999px;padding:2px 0;text-align:center}
.chk .y{background:var(--good-soft);color:var(--good)} .chk .n{background:var(--bad-soft);color:var(--bad)} .chk .w{background:var(--warn-soft);color:var(--warn)}
.ask{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.ask h4{margin:0;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.ask ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink2);display:grid;gap:2px}
.mix .sub{margin:0}
input::placeholder{color:var(--ink2);opacity:.7}
.wv{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr) 52px;gap:6px;align-items:center}
.wv-h{font-size:11px;color:var(--ink2)} .wv-h span:last-child{text-align:right}
input.tm{font-family:var(--f-num);width:100%;text-align:center}
.row input.tm{width:96px}
.off{opacity:.45}
.conf{font-size:11.5px;color:var(--ink2)}
.foot{font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.tag{font:600 10.5px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:2px 6px}
@media (prefers-reduced-motion:no-preference){.fillbar b,.track div{transition:width .25s ease}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">D2S Core Planner</div>
      <h1 id="h1">New Seller</h1>
      <p id="lede"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lvi" data-l="vi">VI</button><button type="button" id="len" data-l="en">EN</button>
    </div>
  </header>

  <div class="lang tabs" role="group" id="tabs"><button type="button" data-tab="upd" data-t="tabUpd" hidden></button><button type="button" data-tab="plan" data-t="tabPlan"></button><button type="button" data-tab="asm" data-t="tabAsm"></button></div>
  <div id="upd" hidden></div>
  <div id="asm" hidden></div>
  <div class="grid" id="plan">
    <form class="panel inputs" id="f" autocomplete="off">
      <div class="pre"><label for="preset" data-t="preL"></label><select id="preset"></select><button type="button" id="advBtn" class="ghost"></button></div>
      <div class="grp">
        <h3><b data-t="g1"></b><span class="tag" id="sample"></span></h3>
        <div class="row"><label for="R" data-t="reg"></label><select id="R"></select></div>
        <div class="row"><label for="ll" data-t="llL"></label><input type="text" id="ll" inputmode="decimal" placeholder="10.83, 106.92" style="width:170px"></div>
        <div class="row"><label for="hub" data-t="hubL"></label><select id="hub"></select></div>
        <div class="row"><label for="sup" data-t="supL"></label><select id="sup"></select></div>
        <p class="meta" id="hsNote" aria-live="polite"></p>
        <div class="socs" id="socs"></div>
        <p class="hint" id="sochint"></p>
        <div id="waves" class="grid0" style="display:grid;gap:6px"></div>
        <div class="row adv"><label for="tail" data-t="tailL"></label><input type="number" id="tail" min="0" max="100" step="5"></div>
        <div class="trio adv" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label for="dwFix"><span data-t="dwFixL"></span><input type="number" id="dwFix" min="0" step="1"></label><label for="dwRate"><span data-t="dwRateL"></span><input type="number" id="dwRate" min="0" step="0.5"></label></div>
      </div>
      <div class="grp">
        <h3><b data-t="g2"></b></h3>
        <div class="trio" id="ado"></div>
        <div class="trio" id="days"></div>
        <div class="row"><label for="beta" data-t="beta"></label><input type="number" id="beta" min="0" max="100" step="1"></div>
      </div>
      <div class="grp">
        <h3><b data-t="g3"></b></h3>
        <div class="row adv"><label for="like" data-t="like"></label><select id="like"></select></div>
        <div class="row"><label for="capOv" data-t="capOvL"></label><input type="number" id="capOv" min="0" step="50"></div>
        <p class="hint" id="howtxt"></p>
      </div>
      <div class="grp">
        <h3><b data-t="g4"></b></h3>
        <p class="lab2" style="font-size:12px;font-weight:600;margin:0 0 4px"><span data-t="cuL"></span></p><div class="cub" id="chs"></div><p class="hint" data-t="cuHint"></p>
        <div class="row"><label for="lab" data-t="labL"></label><select id="lab"></select></div>
        <div class="row"><label for="ban" data-t="banL"></label><select id="ban"></select></div>
        <p class="hint" id="banNote"></p>
        <div class="row adv"><label for="osCap" data-t="osCapL"></label><input type="number" id="osCap" min="0" step="1"></div>
        <div class="row adv"><label for="slackMin" data-t="slackL"></label><input type="number" id="slackMin" min="0" step="5"></div>
        <div class="row adv"><label for="delay" data-t="delayL"></label><input type="number" id="delay" min="0" step="5"></div>
        <p class="hint" id="cotlist"></p>
      </div>
      <div class="grp adv">
        <h3><b data-t="g5"></b></h3>

/* FM Hub ↔ Sup ràng buộc nhau theo các điểm D2S đang chạy của vùng: chọn Hub → chỉ còn Sup phụ trách Hub đó; chọn Sup → chỉ còn các Hub Sup đó phụ trách */
/* cặp Hub–Sup: bảng phân công Hub → Sup của vùng (tab Mng treemap) và Sup các điểm D2S đang chạy (bỏ Sup lỗi dạng "(…)") */
function hsPairs(){const G=REF.reg[X.R],ok=s=>s&&!s.startsWith("(");return (G.hs||[]).filter(([h,s])=>h&&ok(s)).map(([hub,sup])=>({hub,sup})).concat(G.pts.filter(q=>q.hub&&ok(q.sup)));}
function fillHS(){const PR=hsPairs(),uq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y));
  const hubs=uq(PR.filter(q=>!X.sup||q.sup===X.sup).map(q=>q.hub)),sups=uq(PR.filter(q=>!X.hub||q.hub===X.hub).map(q=>q.sup));
  const opt=(v,lab)=>`<option value="${esc(v)}"${v===lab?" selected":""}>${esc(v)}</option>`;
  $("hub").innerHTML=`<option value="">${X.sup?T("hubAny"):T("unk")}</option>`+hubs.map(h=>opt(h,X.hub)).join("");
  $("sup").innerHTML=`<option value="">${X.hub?T("supAny"):T("unk")}</option>`+sups.map(h=>opt(h,X.sup)).join("");
  $("hsNote").textContent=X.hub&&X.sup?"":X.hub?TX.hsHub(sups.length)[L]:X.sup?TX.hsSup(hubs.length)[L]:"";}
/* đổi Hub: Sup không phụ trách Hub đó thì bỏ (Hub chỉ có một Sup thì tự điền); đổi Sup: Hub không thuộc Sup đó thì bỏ */
function linkHS(id){const PR=hsPairs();
  if(id==="hub"&&X.hub){const ss=[...new Set(PR.filter(q=>q.hub===X.hub).map(q=>q.sup))];if(!ss.includes(X.sup))X.sup=ss.length===1?ss[0]:"";}
  if(id==="sup"&&X.sup){const hs=new Set(PR.filter(q=>q.sup===X.sup).map(q=>q.hub));if(X.hub&&!hs.has(X.hub))X.hub="";}
  fillHS();}
/* CHUTE & TO: kéo SOC vào chute (sort cho SOC nào), chọn TO của chute đi SOC nào. Chạm SOC rồi chạm chute để chuyển (điện thoại) */
function mainSoc(){return X.socs.slice().sort((a,b)=>b.sh-a.sh)[0].s;}
function sn(x){return x.replace(/ (Mega )?SOC$/,"");}
function cuNorm(L){const names=X.socs.map(o=>o.s),seen=new Set();L.forEach(c=>{c.socs=c.socs.filter(n=>names.includes(n)&&!seen.has(n)&&seen.add(n));if(!names.includes(c.to))c.to=c.socs[0]||mainSoc();});
  const miss=names.filter(n=>!seen.has(n));if(miss.length){let m=L.find(c=>c.to===mainSoc());if(!m)L.push(m={socs:[],to:mainSoc()});m.socs.push(...miss);}return L;}
function cuDefault(){const c=X.ch?X.ch[0]:X.socs.length,r=X.socs.slice().sort((a,b)=>b.sh-a.sh),L=r.slice(0,Math.max(1,c)).map(o=>({socs:[o.s],to:o.s}));return cuNorm(L);}

function read(){
  const G=REF.reg[X.R];X.socs.forEach((o,j)=>{o.sh=Math.max(0,+$("ss"+j).value||0);o.km=Math.max(0,+$("sk"+j).value||0);});

  $("bars").innerHTML=D.map(d=>{const t=d.truck/d.X,l=d.lab/d.X,so=d.soc/d.X,s=p.fmU-t-l-so;return `<div class="bar"><span>${dt[d.t]}</span><div class="track" role="img" aria-label="${dt[d.t]}: ${nf(t+l+so)} ${T("per")}"><div class="t" style="width:${t/mx*100}%"></div><div class="p" style="width:${l/mx*100}%"></div><div class="so" style="width:${so/mx*100}%"></div><span class="fm" style="left:${p.fmU/mx*100}%"></span></div><span class="n" style="font-family:var(--f-num);text-align:right">${nf(t+l+so)} <span class="${s>=0?"pos":"neg"}" style="font-size:11px">${s>=0?"−":"+"}${nf(Math.abs(s))}</span></span></div>`;}).join("");
  /* sức chở */
  const how=p.how.k==="like"?TX.howLike(short(p.how.name))[L]:p.how.k==="reg"?TX.howReg(p.how.n)[L]:p.how.k==="all"?TX.howAll(p.how.n)[L]:TX.howNear(p.how.n)[L];
  $("howtxt").textContent=how;$("o5s").textContent=T("o5s")+" "+how;
  const used=new Set();D.forEach(d=>d.W.forEach(w=>Object.keys(w.mix).forEach(k=>used.add(k))));
  $("cap").innerHTML=`<thead><tr><th>${T("cap")}</th><th class="n">${T("capq")}</th><th class="n">${T("price")}</th><th></th></tr></thead><tbody>${p.cap.map(c=>`<tr class="${c.on?"":"off"}"><td><span class="truck">${c.k}</span></td><td class="n">${nf(c.q)}${c.q0!==c.q?`<div class="meta">${T("learned")} ${nf(c.q0)}</div>`:""}</td><td class="n">${nf(c.p)}</td><td class="conf">${!c.on?T("notAllowed"):used.has(c.k)?T("used"):""}</td></tr>`).join("")}</tbody>`;
  $("foot").innerHTML=TX.foot[L].map(s=>`<span>${esc(s)}</span>`).join("");
}
$("chs").addEventListener("click",e=>{const d=e.target.closest("[data-cud]");if(d){X.cuDay=+d.dataset.cud;render();return;}
  if(e.target.closest("[data-cuadd]")){cuEdit(L=>L.push({socs:[],to:mainSoc()}));return;}
  const dl=e.target.closest("[data-cudel]");if(dl){const i=+dl.dataset.cudel;cuEdit(CL=>{const c=CL.splice(i,1)[0];if(!c||!c.socs.length||!CL.length)return;
    /* bớt chute: SOC của chute đó dồn sang chute cùng TO; không có thì sang chute đi SOC chính; không có nữa thì chute đầu */
    const t=CL.find(q=>q.to===c.to)||CL.find(q=>q.to===mainSoc())||CL[0];t.socs.push(...c.socs);X.cuMsg=TX.cuMoved(c.socs.map(sn).join(", "),sn(t.to))[L];});return;}
  const ch=e.target.closest("[data-soc]");if(ch){X.cuSel=X.cuSel===ch.dataset.soc?null:ch.dataset.soc;render();return;}
  const cu=e.target.closest("[data-chu]");if(cu&&X.cuSel&&!e.target.closest("select,label")){const n=X.cuSel;X.cuSel=null;cuEdit(L=>{L.forEach(c=>{c.socs=c.socs.filter(q=>q!==n);});L[+cu.dataset.chu].socs.push(n);});}});
$("chs").addEventListener("change",e=>{e.stopPropagation();if(e.target.id==="cuSame"){X.cuSame=e.target.checked;if(X.cuSame)cuEdit(()=>{});else render();return;}
  const s=e.target.dataset.cuto;if(s!=null){const v=e.target.value;cuEdit(L=>{L[+s].to=v;});}});
$("chs").addEventListener("input",e=>e.stopPropagation());
$("chs").addEventListener("dragstart",e=>{const c=e.target.closest("[data-soc]");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.soc);e.dataTransfer.effectAllowed="move";});
$("chs").addEventListener("dragover",e=>{const c=e.target.closest("[data-chu]");if(!c)return;e.preventDefault();c.classList.add("ov");});
$("chs").addEventListener("dragleave",e=>{const c=e.target.closest("[data-chu]");if(c&&!c.contains(e.relatedTarget))c.classList.remove("ov");});
$("chs").addEventListener("drop",e=>{const c=e.target.closest("[data-chu]");if(!c)return;e.preventDefault();const n=e.dataTransfer.getData("text/plain");if(!n)return;cuEdit(L=>{L.forEach(q=>{q.socs=q.socs.filter(x=>x!==n);});L[+c.dataset.chu].socs.push(n);});});
$("f").addEventListener("submit",e=>e.preventDefault());
$("upd").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;X.tab=b.dataset.go;render();window.scrollTo(0,0);});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;X.tab=b.dataset.tab;render();});
$("ttday").addEventListener("click",e=>{const b=e.target.closest("[data-ttd]");if(!b)return;X.ttd=+b.dataset.ttd;render();});
$("mrg").addEventListener("change",e=>{const n=e.target.dataset&&e.target.dataset.pick;if(!n)return;X.pick=e.target.checked?[...new Set(X.pick.concat([n]))]:X.pick.filter(q=>q!==n);render();});
$("advBtn").addEventListener("click",()=>{X.adv=!X.adv;drawForm();});
$("f").addEventListener("input",e=>{if(e.target.id==="R")return;if(e.target.id==="preset"){if(e.target.value){applyPreset(e.target.value);drawForm();render();}else X.preset="";return;}if(X.preset){X.preset="";$("preset").value="";}read();if(e.target.id==="hub"||e.target.id==="sup")linkHS(e.target.id);render();});
$("f").addEventListener("change",e=>{if(e.target.id!=="R")return;X.preset="";X.R=e.target.value;X.like="";X.hub="";X.sup="";X.pick=[];X.chutes=null;fillRegion(false);drawForm();render();});
document.querySelectorAll("header .lang button").forEach(b=>b.addEventListener("click",()=>{L=b.dataset.l==="en"?1:0;try{localStorage.setItem("d2s-ns-lang",b.dataset.l);}catch(e){}drawForm();render();}));
drawForm();render();
})();
</script>
